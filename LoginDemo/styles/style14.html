<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>風格十四：滿版劇場｜振興醫院登入</title>
    <style>
        /* ===== 風格十四：Full-bleed Theater 滿版劇場 ===== */
        :root {
            --ch-primary: #003366;
            --ch-primary-dark: #001d33;
            --ch-secondary: #C19A6B;
            --ch-secondary-light: #d9b889;
            --ch-success: #558B2F;
            --ch-danger: #c94a4a;
            --ch-font-sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
            --ch-font-serif: "Noto Serif TC", "Times New Roman", serif;
            --tr: 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: var(--ch-font-sans);
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            overflow: hidden;
            color: #fff;
            background: var(--ch-primary-dark);
        }

        /* 滿版背景層：圖片優先，無圖時以漸層 fallback */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-size: cover;
            background-position: center;
            transition: background-image 0.9s ease;
            background-image:
                linear-gradient(120deg, rgba(0,29,51,0.92) 0%, rgba(0,51,102,0.78) 45%, rgba(0,82,138,0.55) 100%),
                linear-gradient(135deg, #003366 0%, #00528a 55%, #335c85 100%);
        }

        .bg-layer.has-bg-image {
            background-image: var(--bg-image, none);
        }

        /* 主題色暈：依星期 / 節日微調氛圍 */
        .bg-layer.theme-sun { background-image: linear-gradient(120deg, rgba(40,22,12,0.9), rgba(0,51,102,0.75)), linear-gradient(135deg, #4a2c1a 0%, #003366 100%); }
        .bg-layer.theme-mon { background-image: linear-gradient(120deg, rgba(0,18,34,0.92), rgba(0,51,102,0.78)), linear-gradient(135deg, #002244 0%, #00528a 100%); }
        .bg-layer.theme-tue { background-image: linear-gradient(120deg, rgba(0,34,45,0.9), rgba(0,82,138,0.7)), linear-gradient(135deg, #003a4d 0%, #558B2F 120%); }
        .bg-layer.theme-wed { background-image: linear-gradient(120deg, rgba(0,29,51,0.92), rgba(0,51,102,0.78)), linear-gradient(135deg, #003366 0%, #335c85 100%); }
        .bg-layer.theme-thu { background-image: linear-gradient(120deg, rgba(13,24,31,0.92), rgba(0,82,138,0.75)), linear-gradient(135deg, #1a2d3a 0%, #00528a 100%); }
        .bg-layer.theme-fri { background-image: linear-gradient(120deg, rgba(0,29,51,0.9), rgba(0,51,102,0.75)), linear-gradient(135deg, #003366 0%, #C19A6B 140%); }
        .bg-layer.theme-sat { background-image: linear-gradient(120deg, rgba(20,31,15,0.9), rgba(0,51,102,0.75)), linear-gradient(135deg, #2a3b1a 0%, #003366 100%); }

        .bg-layer.theme-newyear { background-image: linear-gradient(120deg, rgba(60,10,10,0.9), rgba(0,51,102,0.75)), linear-gradient(135deg, #5a1010 0%, #003366 100%); }
        .bg-layer.theme-lunar { background-image: linear-gradient(120deg, rgba(90,11,8,0.92), rgba(90,11,8,0.85)), linear-gradient(135deg, #8c1c13 0%, #5a0b08 100%); }
        .bg-layer.theme-christmas { background-image: linear-gradient(120deg, rgba(8,36,26,0.92), rgba(12,70,45,0.78)), linear-gradient(135deg, #0c2e23 0%, #1a5c3a 100%); }
        .bg-layer.theme-midautumn { background-image: linear-gradient(120deg, rgba(18,28,38,0.92), rgba(38,58,85,0.78)), linear-gradient(135deg, #1a2a3a 0%, #335c85 100%); }
        .bg-layer.theme-anniversary { background-image: linear-gradient(120deg, rgba(0,29,51,0.9), rgba(100,70,45,0.75)), linear-gradient(135deg, #003366 0%, #a07a4d 130%); }
        .bg-layer.theme-dragonboat { background-image: linear-gradient(120deg, rgba(20,60,40,0.92), rgba(46,94,62,0.78)), linear-gradient(135deg, #1f5c3d 0%, #2e7d52 45%, #c97f3a 130%); }

        /* 滿版暗角與顆粒，增加劇場感 */
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 0%, transparent 0%, rgba(0,13,26,0.55) 80%, rgba(0,13,26,0.85) 100%),
                radial-gradient(circle at 80% 80%, rgba(193,154,107,0.12), transparent 42%);
        }

        .bg-grain {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* 返回連結 */
        .back-link {
            position: fixed;
            top: 22px;
            left: 24px;
            z-index: 20;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 999px;
            color: #fff;
            background: rgba(0,0,0,0.22);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            backdrop-filter: blur(10px);
            transition: var(--tr);
        }
        .back-link:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.5); }

        /* 滿版舞台：內容貼齊四邊 */
        .stage {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            grid-template-columns: 1fr minmax(360px, 460px);
            grid-template-rows: 1fr auto;
        }

        /* 左上：大標語與品牌 */
        .hero-zone {
            grid-column: 1;
            grid-row: 1 / span 2;
            padding: clamp(32px, 6vw, 84px);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            animation: fadeUp 0.8s 0.1s both;
        }

        .brand-logo-img {
            max-height: 54px;
            max-width: 200px;
            object-fit: contain;
            display: block;
            filter: brightness(0) invert(1);
        }

        .brand-mark {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
        }

        .brand-mark svg { width: 30px; height: 30px; }

        .brand-eyebrow {
            font-size: 0.66rem;
            letter-spacing: 3px;
            color: var(--ch-secondary-light);
            font-weight: 600;
        }

        .company-name {
            font-family: var(--ch-font-serif);
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            letter-spacing: 4px;
            line-height: 1.2;
        }

        .hero-copy {
            max-width: 620px;
            animation: fadeUp 0.8s 0.2s both;
        }

        .hero-copy h1 {
            font-family: var(--ch-font-serif);
            font-size: clamp(3.2rem, 7vw, 7rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .hero-copy h1 em {
            color: var(--ch-secondary-light);
            font-style: normal;
        }

        .hero-copy p {
            max-width: 480px;
            font-size: clamp(0.95rem, 1.4vw, 1.15rem);
            line-height: 1.8;
            color: rgba(255,255,255,0.78);
        }

        /* 節慶橫幅 */
        .festival-banner {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.28);
            animation: fadeUp 0.8s 0.25s both;
        }
        .festival-banner .fb-icon { font-size: 1.25rem; }
        .festival-banner .fb-label { font-family: var(--ch-font-serif); font-weight: 700; font-size: 1rem; letter-spacing: 1px; }
        .festival-banner .fb-wish { font-size: 0.8rem; color: rgba(255,255,255,0.75); }

        /* 右側：登入卡片（玻璃面板） */
        .login-zone {
            grid-column: 2;
            grid-row: 1 / span 2;
            padding: clamp(28px, 4vw, 56px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.18);
            backdrop-filter: blur(22px);
            animation: slideIn 0.85s 0.15s both;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

        .login-kicker {
            font-size: 0.68rem;
            letter-spacing: 3px;
            color: var(--ch-secondary-light);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .login-title {
            font-family: var(--ch-font-serif);
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 32px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .field-label {
            display: block;
            margin-bottom: 7px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            letter-spacing: 1px;
        }

        .field-input { position: relative; }

        .field-input input {
            width: 100%;
            padding: 14px 48px 14px 16px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: var(--tr);
        }

        .field-input input::placeholder { color: rgba(255,255,255,0.45); }

        .field-input input:focus {
            border-color: var(--ch-secondary);
            background: rgba(255,255,255,0.14);
            box-shadow: 0 0 0 0.2rem rgba(193,154,107,0.25);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--ch-secondary-light);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }

        .field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            font-size: 0.84rem;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: rgba(255,255,255,0.8);
        }

        .checkbox input { accent-color: var(--ch-secondary); width: 16px; height: 16px; }

        .link-forgot {
            color: var(--ch-secondary-light);
            text-decoration: none;
            font-weight: 600;
        }
        .link-forgot:hover { text-decoration: underline; }

        .form-message {
            min-height: 18px;
            font-size: 0.82rem;
            color: var(--ch-danger);
        }
        .form-message.success { color: #a3d977; }

        .btn-login {
            margin-top: 4px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--ch-secondary), #a07a4d);
            color: #1a1206;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 5px;
            cursor: pointer;
            transition: var(--tr), transform 0.15s;
        }

        .btn-login:hover {
            box-shadow: 0 14px 34px rgba(193,154,107,0.35);
            transform: translateY(-2px);
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

        .login-foot {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.15);
            font-size: 0.72rem;
            color: rgba(255,255,255,0.55);
            line-height: 1.7;
        }

        /* 底部公告列 */
        .announcement-zone {
            grid-column: 1 / -1;
            grid-row: 2;
            align-self: end;
            padding: 18px clamp(28px, 6vw, 84px);
            background: rgba(0,0,0,0.35);
            border-top: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(14px);
            animation: fadeUp 0.8s 0.35s both;
        }

        .announcement-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 10px;
        }

        .announcement-head h2 {
            font-family: var(--ch-font-serif);
            font-size: 0.95rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .announcement-head h2::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ch-secondary);
            box-shadow: 0 0 0 4px rgba(193,154,107,0.25);
        }

        .announcement-date { font-size: 0.74rem; color: rgba(255,255,255,0.6); }

        .announcement-list {
            list-style: none;
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .announcement-list li {
            flex: 0 0 auto;
            max-width: 320px;
            padding: 10px 0;
            font-size: 0.82rem;
            line-height: 1.55;
            color: rgba(255,255,255,0.85);
        }

        .announcement-list .tag {
            display: inline-block;
            font-size: 0.64rem;
            padding: 2px 9px;
            border-radius: 999px;
            margin-right: 7px;
            background: rgba(255,255,255,0.18);
            color: #fff;
        }
        .announcement-list .tag.urgent { background: rgba(201,74,74,0.85); }
        .announcement-list .tag.event { background: rgba(193,154,107,0.85); color: #1a1206; }

        /* 響應式：平板以下改為單欄疊加 */
        @media (max-width: 900px) {
            .stage {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .hero-zone {
                grid-column: 1;
                grid-row: 1;
                padding: 90px 28px 32px;
                justify-content: flex-start;
            }
            .login-zone {
                grid-column: 1;
                grid-row: 2;
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.12);
                background: rgba(0,0,0,0.28);
                padding: 36px 28px;
            }
            .announcement-zone {
                grid-column: 1;
                grid-row: 3;
                padding: 18px 28px;
            }
            .announcement-list {
                flex-direction: column;
                gap: 0;
                max-height: 140px;
                overflow-y: auto;
            }
            .announcement-list li { max-width: none; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.15); }
            .announcement-list li:last-child { border-bottom: none; }
        }

        @media (max-width: 480px) {
            .hero-copy h1 { font-size: 2.4rem; }
            .company-name { font-size: 1.4rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回款式選擇</a>
    <div id="bgLayer" class="bg-layer"></div>
    <div class="bg-overlay"></div>
    <div class="bg-grain"></div>

    <main class="stage">
        <section class="hero-zone" aria-label="醫院品牌與歡迎訊息">
            <div class="brand">
                <div class="brand-mark" id="brandLogo" aria-hidden="true">
                    <svg viewBox="0 0 56 56" fill="none">
                        <circle cx="28" cy="28" r="25" stroke="#C19A6B" stroke-width="2" />
                        <path d="M28 15v26M15 28h26" stroke="#C19A6B" stroke-width="4.5" stroke-linecap="round" />
                    </svg>
                </div>
                <div>
                    <p class="brand-eyebrow">CHENG HSIN GENERAL HOSPITAL</p>
                    <h1 class="company-name">振興醫院</h1>
                </div>
            </div>

            <div class="hero-copy">
                <div class="festival-banner" id="festivalBanner" style="display:none"></div>
                <h1>以人為本，<br><em>視病猶親。</em></h1>
                <p>歡迎回到員工資訊整合入口。請於右側登入，開啟院內服務與作業平台。</p>
            </div>
        </section>

        <section class="login-zone" aria-label="登入表單">
            <p class="login-kicker">STAFF PORTAL</p>
            <h2 class="login-title">員工登入</h2>
            <p class="login-subtitle" id="greeting"></p>

            <form id="loginForm" class="login-form" novalidate>
                <div>
                    <label class="field-label" for="username">帳號</label>
                    <div class="field-input">
                        <input type="text" id="username" name="username" autocomplete="username" placeholder="請輸入員工編號或帳號" required />
                    </div>
                </div>
                <div>
                    <label class="field-label" for="password">密碼</label>
                    <div class="field-input">
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="請輸入密碼" required />
                        <button type="button" class="toggle-password" id="togglePassword">顯示</button>
                    </div>
                </div>
                <div class="field-row">
                    <label class="checkbox"><input type="checkbox" id="remember" /> <span>記住我</span></label>
                    <a href="#" class="link-forgot">忘記密碼？</a>
                </div>
                <p class="form-message" id="formMessage" role="alert"></p>
                <button type="submit" class="btn-login">登 入</button>
            </form>

            <p class="login-foot">
                © <span id="year"></span> 振興醫院 Cheng Hsin General Hospital.<br>
                系統使用規範與資安政策請參閱院內公告。
            </p>
        </section>

        <section class="announcement-zone" aria-label="系統公告">
            <div class="announcement-head">
                <h2>系統公告</h2>
                <span class="announcement-date" id="todayLabel"></span>
            </div>
            <ul class="announcement-list" id="announcementList"></ul>
        </section>
    </main>

    <script src="../shared/login-core.js"></script>
</body>
</html>
