<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>風格八：瑞士訊號｜振興醫院登入</title>
    <style>
        :root { --blue:#003d73; --signal:#f04b32; --paper:#f5f5f2; --ink:#111; --line:#b9bec2; --ok:#246d3c; --sans:"Arial Narrow","Noto Sans TC","Microsoft JhengHei",sans-serif; }
        *{box-sizing:border-box} html,body{min-height:100%;margin:0} body{min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--sans)}
        .bg-layer{position:fixed;inset:0;z-index:-2;background:var(--paper)} .bg-layer::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(50% - .5px),rgba(0,61,115,.16) 50%,transparent calc(50% + .5px))}
        .bg-layer.theme-lunar,.bg-layer.theme-newyear{background:#f5ece9}.bg-layer.theme-christmas{background:#edf3ef}.bg-layer.theme-anniversary{background:#edf1f4}
        .back-link{position:fixed;top:20px;right:26px;z-index:5;color:var(--blue);font-size:.76rem;font-weight:900;text-decoration:none;text-transform:uppercase}
        .page{width:min(1240px,calc(100% - 48px));min-height:100dvh;margin:auto;padding:60px 0 26px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto}
        .top{grid-column:1/-1;padding:13px 0 17px;border-top:8px solid var(--blue);border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;align-items:end}
        .brand{display:flex;gap:12px;align-items:center}.brand svg{width:42px;height:42px}.brand-logo-img{max-width:190px;max-height:46px;object-fit:contain;filter:brightness(.35) saturate(1.8)}
        .company-name{color:var(--blue);font-size:1.32rem;font-weight:950;letter-spacing:.08em}.brand-en{margin:2px 0 0;font-size:.62rem;font-weight:800;letter-spacing:.12em}
        .top-meta{text-align:right;font-size:.72rem;line-height:1.7}.top-meta b{color:var(--signal)}
        .statement{padding:9vh 6vw 8vh 0;border-right:1px solid var(--ink);animation:show .55s ease both}
        .index{margin:0 0 24px;color:var(--signal);font-size:.76rem;font-weight:950;letter-spacing:.14em}
        h1{max-width:650px;margin:0;color:var(--blue);font-size:clamp(4.5rem,8.5vw,9.4rem);font-weight:950;letter-spacing:-.075em;line-height:.79;text-transform:uppercase}
        h1 span{display:block;color:var(--signal)}
        .statement p{max-width:390px;margin:38px 0 0;padding-top:13px;border-top:4px solid var(--ink);font-size:.95rem;font-weight:700;line-height:1.65}
        .login{padding:9vh 0 7vh 6vw;animation:show .55s .1s ease both}
        .login h2{margin:0;color:var(--blue);font-size:2rem;line-height:1}.login-sub{margin:7px 0 32px;color:#555;font-size:.82rem}
        .festival-banner{margin-bottom:23px;padding:10px;border:2px solid var(--signal);color:var(--signal);font-size:.78rem;font-weight:900}.festival-banner .fb-wish{margin-left:8px;color:#555;font-weight:500}
        .field{margin-bottom:20px}.field-label{display:block;margin-bottom:7px;font-size:.72rem;font-weight:950;letter-spacing:.1em}
        .field-input{position:relative}.field-input input{width:100%;padding:14px 55px 14px 13px;border:2px solid var(--ink);border-radius:0;background:#fff;color:var(--ink);font:700 .92rem var(--sans);outline:0}
        .field-input input:focus{border-color:var(--signal);box-shadow:5px 5px 0 var(--signal)}.toggle-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--blue);font-weight:950;cursor:pointer}
        .field-row{display:flex;justify-content:space-between;gap:14px;font-size:.78rem;font-weight:700}.checkbox{display:flex;gap:7px;align-items:center}.checkbox input{accent-color:var(--signal)}.link-forgot{color:var(--blue)}
        .form-message{min-height:20px;margin:14px 0 7px;color:var(--signal);font-size:.78rem;font-weight:800}.form-message.success{color:var(--ok)}
        .btn-login{width:100%;padding:15px;border:2px solid var(--blue);border-radius:0;background:var(--blue);color:#fff;font:950 .95rem var(--sans);letter-spacing:.23em;cursor:pointer;transition:background .15s,color .15s,transform .15s}.btn-login:hover{background:var(--signal);border-color:var(--signal)}.btn-login:active{transform:translateY(2px)}
        .footer{grid-column:1/-1;border-top:6px solid var(--signal);display:grid;grid-template-columns:minmax(0,1fr) 190px}
        .ann{padding:18px 30px 0 0;border-right:1px solid var(--ink)}.ann-head{margin-bottom:12px;display:flex;align-items:end;justify-content:space-between;gap:20px}.ann h3{margin:0;color:var(--blue);font-size:1rem;letter-spacing:.08em}.ann-date{font-size:.68rem;font-weight:900;white-space:nowrap}
        .announcement-list{max-height:170px;margin:0;padding:0;overflow:auto;list-style:none;display:grid;grid-template-columns:1.2fr 1fr;gap:0 24px}.announcement-list li{padding:8px 0;border-top:1px solid var(--line);font-size:.74rem;line-height:1.5}.announcement-list li:first-child{grid-row:span 4;padding:14px;border:0;background:var(--blue);color:#fff;font-size:.88rem;font-weight:800}.announcement-list .tag{margin-right:6px;color:var(--signal);font-weight:950}.announcement-list li:first-child .tag{display:block;width:max-content;margin:0 0 9px;padding:2px 6px;background:var(--signal);color:#fff}
        .copyright{padding:18px 0 0 24px;font-size:.7rem;line-height:1.6}
        @keyframes show{from{opacity:0;transform:translateY(18px)}} @media(max-width:820px){.page{width:calc(100% - 28px);grid-template-columns:1fr;padding-top:70px}.top{grid-column:1}.statement{padding:60px 0;border-right:0;border-bottom:1px solid var(--ink)}.login{padding:54px 0}.footer{grid-column:1;grid-template-columns:1fr}.ann{padding-right:0;border-right:0}.announcement-list{grid-template-columns:1fr}.announcement-list li:first-child{grid-row:auto}.copyright{padding-left:0;padding-bottom:20px}h1{font-size:clamp(4rem,22vw,7rem)}} @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">返回款式選擇</a><div id="bgLayer" class="bg-layer"></div>
    <main class="page">
        <header class="top"><div class="brand"><span id="brandLogo"><svg viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="25" stroke="#f04b32" stroke-width="2"/><path d="M28 15v26M15 28h26" stroke="#f04b32" stroke-width="5"/></svg></span><div><div class="company-name">振興醫院</div><p class="brand-en">CHENG HSIN GENERAL HOSPITAL</p></div></div><div class="top-meta"><b>STAFF INFORMATION PORTAL</b><br><span id="todayLabel"></span></div></header>
        <section class="statement"><p class="index">ACCESS / CARE / CONNECT</p><h1>醫療<span>連線</span></h1><p>精準、安全、即時。登入院內資訊系統，讓每一項工作保持清楚流動。</p></section>
        <section class="login" aria-labelledby="loginTitle"><h2 id="loginTitle">系統登入</h2><p class="login-sub" id="greeting"></p><div class="festival-banner" id="festivalBanner" style="display:none"></div>
            <form id="loginForm" novalidate>
                <div class="field"><label class="field-label" for="username">01 / 帳號 ACCOUNT</label><div class="field-input"><input id="username" name="username" type="text" autocomplete="username" placeholder="員工編號或帳號" required></div></div>
                <div class="field"><label class="field-label" for="password">02 / 密碼 PASSWORD</label><div class="field-input"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required><button class="toggle-password" id="togglePassword" type="button">顯示</button></div></div>
                <div class="field-row"><label class="checkbox"><input id="remember" type="checkbox">記住我</label><a class="link-forgot" href="#">忘記密碼？</a></div><p class="form-message" id="formMessage" role="alert"></p><button class="btn-login" type="submit">安全登入</button>
            </form>
        </section>
        <footer class="footer"><aside class="ann"><div class="ann-head"><h3>重要系統公告</h3><span class="ann-date" id="todayLabelAnn"></span></div><ul class="announcement-list" id="announcementList"></ul></aside><div class="copyright">© <span id="year"></span> 振興醫院<br>CHENG HSIN GENERAL HOSPITAL</div></footer>
    </main>
    <script src="../shared/login-core.js"></script>
</body>
</html>
