<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>風格二：玻璃擬態 — 振興醫院登入</title>
    <style>
        /* ===== 風格二：Glassmorphism 玻璃擬態 ===== */
        :root {
            --ch-primary: #003366; --ch-secondary: #C19A6B; --ch-secondary-dark: #a07a4d;
            --ch-success: #558B2F; --ch-danger: #ff7a7a;
            --ch-font-sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
            --ch-font-serif: "Noto Serif TC", "Times New Roman", serif;
            --glass: rgba(255,255,255,0.12); --glass-border: rgba(255,255,255,0.28);
            --tr: 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { font-family: var(--ch-font-sans); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; color: #fff; padding: 24px; }
        .bg-layer { position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center; transition: background-image 0.9s ease; background-image: linear-gradient(135deg, #003366 0%, #00528a 55%, #335c85 100%); }
        .bg-overlay { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 30% 30%, rgba(193,154,107,0.25), transparent 50%), linear-gradient(120deg, rgba(0,18,38,0.55), rgba(0,18,38,0.3)); }
        .bg-layer.theme-sun { background-image: linear-gradient(135deg, #4a2c1a 0%, #003366 100%); }
        .bg-layer.theme-mon { background-image: linear-gradient(135deg, #002244 0%, #00528a 100%); }
        .bg-layer.theme-tue { background-image: linear-gradient(135deg, #003a4d 0%, #558B2F 120%); }
        .bg-layer.theme-wed { background-image: linear-gradient(135deg, #003366 0%, #335c85 100%); }
        .bg-layer.theme-thu { background-image: linear-gradient(135deg, #1a2d3a 0%, #00528a 100%); }
        .bg-layer.theme-fri { background-image: linear-gradient(135deg, #003366 0%, #C19A6B 140%); }
        .bg-layer.theme-sat { background-image: linear-gradient(135deg, #2a3b1a 0%, #003366 100%); }
        /* --- 節日設計風格 --- */
        .bg-layer.theme-newyear { background-image: linear-gradient(135deg, #5a1010 0%, #003366 100%); }
        .bg-layer.theme-lunar { background-image: linear-gradient(135deg, #8c1c13 0%, #5a0b08 100%); }
        .bg-layer.theme-christmas { background-image: linear-gradient(135deg, #0c2e23 0%, #1a5c3a 100%); }
        .bg-layer.theme-midautumn { background-image: linear-gradient(135deg, #1a2a3a 0%, #335c85 100%); }
        .bg-layer.theme-anniversary { background-image: linear-gradient(135deg, #003366 0%, #a07a4d 130%); }
        .bg-layer.theme-dragonboat { background-image: linear-gradient(135deg, #1f5c3d 0%, #2e7d52 45%, #c97f3a 130%); }
        /* 漂浮裝飾球 */
        .orb { position: fixed; border-radius: 50%; filter: blur(8px); z-index: -1; opacity: 0.5; animation: float 9s ease-in-out infinite; }
        .orb.a { width: 220px; height: 220px; background: rgba(193,154,107,0.4); top: 12%; left: 8%; }
        .orb.b { width: 160px; height: 160px; background: rgba(85,139,47,0.35); bottom: 14%; right: 10%; animation-delay: 2s; }
        /* 端午時把光球換成粽葉綠／龍舟暖陽 */
        body[data-festival="dragonboat"] .orb.a { background: rgba(255,213,128,0.45); }
        body[data-festival="dragonboat"] .orb.b { background: rgba(31,92,61,0.5); }
        /* 公司 Logo 圖 */
        .brand-logo-img { max-height: 46px; max-width: 170px; object-fit: contain; display: block; }
        /* 節慶橫幅（玻璃風） */
        .festival-banner { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 9px 14px; border-radius: 999px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.35); }
        .festival-banner .fb-icon { font-size: 1.2rem; }
        .festival-banner .fb-label { font-family: var(--ch-font-serif); font-weight: 700; font-size: 0.95rem; color: #fff; }
        .festival-banner .fb-wish { font-size: 0.76rem; color: rgba(255,255,255,0.85); margin-left: auto; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-26px); } }
        .shell { width: min(940px, 100%); display: grid; grid-template-columns: 1fr 360px; gap: 22px; animation: rise 0.7s var(--tr); }
        @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
        .glass { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 22px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 24px 60px rgba(0,0,0,0.3); }
        /* 左：品牌 + 公告 */
        .info { padding: 36px 34px; display: flex; flex-direction: column; }
        .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
        .brand-eyebrow { font-size: 0.64rem; letter-spacing: 2.5px; color: var(--ch-secondary); font-weight: 600; }
        .company-name { font-family: var(--ch-font-serif); font-size: 1.7rem; letter-spacing: 3px; }
        .company-slogan { font-size: 0.82rem; color: rgba(255,255,255,0.75); }
        .info-quote { font-family: var(--ch-font-serif); font-size: 1.1rem; line-height: 1.7; margin-bottom: 22px; color: rgba(255,255,255,0.95); }
        .info-quote span { display: block; font-size: 0.82rem; color: rgba(255,255,255,0.7); font-family: var(--ch-font-sans); margin-top: 4px; }
        .announcement-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .announcement-head h2 { font-family: var(--ch-font-serif); font-size: 1rem; }
        .announcement-date { font-size: 0.74rem; color: rgba(255,255,255,0.7); }
        .announcement-list { list-style: none; overflow-y: auto; max-height: 168px; display: flex; flex-direction: column; gap: 8px; }
        .announcement-list li { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 10px 12px; font-size: 0.84rem; line-height: 1.5; transition: var(--tr); }
        .announcement-list li:hover { background: rgba(255,255,255,0.18); transform: translateX(3px); }
        .announcement-list .tag { display: inline-block; font-size: 0.64rem; padding: 1px 8px; border-radius: 999px; margin-right: 6px; background: rgba(255,255,255,0.25); }
        .announcement-list .tag.urgent { background: rgba(255,90,90,0.7); }
        .announcement-list .tag.event { background: rgba(193,154,107,0.85); }
        .info-foot { margin-top: auto; padding-top: 16px; font-size: 0.78rem; color: rgba(255,255,255,0.7); }
        /* 右：登入 */
        .login { padding: 40px 32px; display: flex; flex-direction: column; justify-content: center; }
        .login-eyebrow { font-size: 0.66rem; letter-spacing: 3px; color: var(--ch-secondary); font-weight: 600; }
        .login-title { font-family: var(--ch-font-serif); font-size: 1.7rem; margin: 4px 0 4px; }
        .login-subtitle { font-size: 0.85rem; color: rgba(255,255,255,0.75); margin-bottom: 26px; }
        .login-form { display: flex; flex-direction: column; gap: 16px; }
        .field-label { font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; display: block; }
        .field-input { position: relative; display: flex; align-items: center; }
        .field-icon { position: absolute; left: 14px; opacity: 0.7; pointer-events: none; }
        .field-input input { width: 100%; padding: 12px 14px 12px 40px; border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; background: rgba(255,255,255,0.1); color: #fff; font-size: 0.92rem; outline: none; transition: var(--tr); }
        .field-input input::placeholder { color: rgba(255,255,255,0.6); }
        .field-input input:focus { border-color: var(--ch-secondary); background: rgba(255,255,255,0.18); box-shadow: 0 0 0 0.2rem rgba(193,154,107,0.3); }
        .toggle-password { position: absolute; right: 12px; border: none; background: transparent; color: var(--ch-secondary); font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .field-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; }
        .checkbox { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .checkbox input { accent-color: var(--ch-secondary); }
        .link-forgot { color: var(--ch-secondary); text-decoration: none; }
        .form-message { min-height: 16px; font-size: 0.8rem; color: var(--ch-danger); }
        .form-message.success { color: #b6e89a; }
        .btn-login { margin-top: 6px; padding: 13px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--ch-secondary), var(--ch-secondary-dark)); color: #fff; font-size: 1rem; letter-spacing: 5px; font-weight: 700; cursor: pointer; transition: var(--tr), transform 0.15s; }
        .btn-login:hover { box-shadow: 0 12px 28px rgba(193,154,107,0.45); transform: translateY(-2px); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-foot { margin-top: 22px; text-align: center; font-size: 0.7rem; color: rgba(255,255,255,0.6); }
        .back-link { position: fixed; top: 18px; left: 18px; z-index: 10; color: #fff; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); padding: 8px 14px; border-radius: 999px; text-decoration: none; font-size: 0.82rem; backdrop-filter: blur(4px); }
        @media (max-width: 820px) { .shell { grid-template-columns: 1fr; } .info { order: 2; } }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回款式選擇</a>
    <div id="bgLayer" class="bg-layer"></div>
    <div class="bg-overlay"></div>
    <span class="orb a"></span><span class="orb b"></span>
    <div class="shell">
        <section class="glass info">
            <div class="brand">
                <span id="brandLogo"><svg viewBox="0 0 56 56" width="46" height="46" fill="none"><circle cx="28" cy="28" r="25" stroke="#C19A6B" stroke-width="2" /><path d="M28 15v26M15 28h26" stroke="#C19A6B" stroke-width="4.5" stroke-linecap="round" /></svg></span>
                <div><p class="brand-eyebrow">CHENG HSIN GENERAL HOSPITAL</p><div class="company-name">振興醫院</div><p class="company-slogan">員工資訊整合入口</p></div>
            </div>
            <div class="festival-banner" id="festivalBanner" style="display:none"></div>
            <p class="info-quote">以人為本，視病猶親<span>打造飯店級的醫療照護體驗</span></p>
            <div class="announcement-head"><h2>系統公告</h2><span class="announcement-date" id="todayLabel"></span></div>
            <ul class="announcement-list" id="announcementList"></ul>
            <div class="info-foot"><span id="greeting"></span></div>
        </section>
        <section class="glass login">
            <p class="login-eyebrow">WELCOME BACK</p>
            <h1 class="login-title">歡迎回來</h1>
            <p class="login-subtitle">請輸入帳號密碼以登入系統</p>
            <form id="loginForm" class="login-form" novalidate>
                <div><label class="field-label" for="username">帳號</label><div class="field-input"><span class="field-icon">&#128100;</span><input type="text" id="username" name="username" placeholder="員工編號或帳號" required /></div></div>
                <div><label class="field-label" for="password">密碼</label><div class="field-input"><span class="field-icon">&#128274;</span><input type="password" id="password" name="password" placeholder="請輸入密碼" required /><button type="button" class="toggle-password" id="togglePassword">顯示</button></div></div>
                <div class="field-row"><label class="checkbox"><input type="checkbox" id="remember" /><span>記住我</span></label><a href="#" class="link-forgot">忘記密碼？</a></div>
                <p class="form-message" id="formMessage" role="alert"></p>
                <button type="submit" class="btn-login">登 入</button>
            </form>
            <p class="login-foot">© <span id="year"></span> 振興醫院 版權所有</p>
        </section>
    </div>
    <script src="../shared/login-core.js"></script>
</body>
</html>
