<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>風格四：便當格儀表板 — 振興醫院登入</title>
    <style>
        /* ===== 風格四：Bento Grid 便當格 ===== */
        :root {
            --ch-primary: #003366; --ch-primary-dark: #002244;
            --ch-secondary: #C19A6B; --ch-secondary-dark: #a07a4d;
            --ch-success: #558B2F; --ch-danger: #A31D1D; --ch-light: #F9F7F2;
            --ch-font-sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
            --ch-font-serif: "Noto Serif TC", "Times New Roman", serif;
            --tr: 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { font-family: var(--ch-font-sans); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; color: #2c2c2c; padding: 24px; }
        .bg-layer { position: fixed; inset: 0; z-index: -2; background-size: cover; transition: background-image 0.9s ease; background-image: linear-gradient(135deg, #003366 0%, #00528a 55%, #335c85 100%); }
        .bg-overlay { position: fixed; inset: 0; z-index: -1; background: linear-gradient(120deg, rgba(0,20,40,0.4), rgba(0,20,40,0.15)); }
        .bg-layer.theme-sun { background-image: linear-gradient(135deg, #4a2c1a 0%, #003366 100%); }
        .bg-layer.theme-mon { background-image: linear-gradient(135deg, #002244 0%, #00528a 100%); }
        .bg-layer.theme-tue { background-image: linear-gradient(135deg, #003a4d 0%, #558B2F 120%); }
        .bg-layer.theme-wed { background-image: linear-gradient(135deg, #003366 0%, #335c85 100%); }
        .bg-layer.theme-thu { background-image: linear-gradient(135deg, #1a2d3a 0%, #00528a 100%); }
        .bg-layer.theme-fri { background-image: linear-gradient(135deg, #003366 0%, #C19A6B 140%); }
        .bg-layer.theme-sat { background-image: linear-gradient(135deg, #2a3b1a 0%, #003366 100%); }
        .bg-layer.theme-newyear { background-image: linear-gradient(135deg, #5a1010 0%, #003366 100%); }
        .bg-layer.theme-lunar { background-image: linear-gradient(135deg, #8c1c13 0%, #5a0b08 100%); }
        .bg-layer.theme-christmas { background-image: linear-gradient(135deg, #0c2e23 0%, #1a5c3a 100%); }
        .bg-layer.theme-midautumn { background-image: linear-gradient(135deg, #1a2a3a 0%, #335c85 100%); }
        .bg-layer.theme-anniversary { background-image: linear-gradient(135deg, #003366 0%, #a07a4d 130%); }
        .bg-layer.theme-dragonboat { background-image: linear-gradient(135deg, #1f5c3d 0%, #2e7d52 45%, #c97f3a 130%); }
        /* 端午時品牌磚改粽葉綠調 */
        body[data-festival="dragonboat"] .tile-brand { background: linear-gradient(150deg, #1f5c3d, #2e7d52); }
        .brand-logo-img { max-height: 48px; max-width: 170px; object-fit: contain; display: block; }
        /* 節慶橫幅（便當格：嵌於品牌磚） */
        .festival-banner { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3); }
        .festival-banner .fb-icon { font-size: 1rem; }
        .festival-banner .fb-label { font-family: var(--ch-font-serif); font-weight: 700; font-size: 0.85rem; color: #fff; }
        .festival-banner .fb-wish { display: none; }
        .bento { width: min(960px, 100%); display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: auto auto auto; gap: 16px; animation: rise 0.7s var(--tr); }
        @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
        .tile { border-radius: 20px; padding: 24px; box-shadow: 0 14px 40px rgba(0,0,0,0.18); transition: transform var(--tr), box-shadow var(--tr); }
        .tile:hover { transform: translateY(-4px); box-shadow: 0 20px 50px rgba(0,0,0,0.24); }
        /* 品牌磚（深藍，跨左欄第一列） */
        .tile-brand { grid-column: 1; grid-row: 1; background: linear-gradient(150deg, var(--ch-primary), #002a52); color: #fff; display: flex; align-items: center; gap: 16px; position: relative; overflow: hidden; }
        .tile-brand::after { content: ""; position: absolute; right: -60px; top: -60px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(193,154,107,0.4), transparent 70%); }
        .brand-eyebrow { font-size: 0.62rem; letter-spacing: 2.5px; color: var(--ch-secondary); font-weight: 600; }
        .company-name { font-family: var(--ch-font-serif); font-size: 1.6rem; letter-spacing: 3px; }
        .company-slogan { font-size: 0.8rem; color: rgba(255,255,255,0.75); }
        /* 登入磚（白，跨右欄兩列） */
        .tile-login { grid-column: 2; grid-row: 1 / span 2; background: #fff; display: flex; flex-direction: column; justify-content: center; }
        .login-eyebrow { font-size: 0.66rem; letter-spacing: 3px; color: var(--ch-secondary); font-weight: 600; }
        .login-title { font-family: var(--ch-font-serif); font-size: 1.5rem; color: var(--ch-primary); margin: 2px 0 4px; }
        .login-subtitle { font-size: 0.82rem; color: #888; margin-bottom: 20px; }
        .login-form { display: flex; flex-direction: column; gap: 14px; }
        .field-label { font-size: 0.78rem; font-weight: 600; color: var(--ch-primary); margin-bottom: 5px; display: block; }
        .field-input { position: relative; display: flex; align-items: center; }
        .field-input input { width: 100%; padding: 11px 14px; border: 1.5px solid #e3dccb; border-radius: 10px; font-size: 0.9rem; background: var(--ch-light); outline: none; transition: var(--tr); }
        .field-input input:focus { border-color: var(--ch-secondary); background: #fff; box-shadow: 0 0 0 0.2rem rgba(193,154,107,0.25); }
        .toggle-password { position: absolute; right: 10px; border: none; background: transparent; color: var(--ch-secondary-dark); font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .field-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; }
        .checkbox { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #666; }
        .checkbox input { accent-color: var(--ch-primary); }
        .link-forgot { color: var(--ch-secondary-dark); text-decoration: none; }
        .form-message { min-height: 14px; font-size: 0.78rem; color: var(--ch-danger); }
        .form-message.success { color: var(--ch-success); }
        .btn-login { margin-top: 4px; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(180deg, var(--ch-primary), var(--ch-primary-dark)); color: #fff; font-size: 0.98rem; letter-spacing: 5px; font-weight: 600; cursor: pointer; transition: var(--tr), transform 0.15s; }
        .btn-login:hover { box-shadow: 0 10px 24px rgba(0,51,102,0.3); transform: translateY(-2px); }
        .btn-login:disabled { opacity: 0.65; cursor: not-allowed; }
        /* 公告磚（白，左欄第二列） */
        .tile-ann { grid-column: 1; grid-row: 2; background: #fff; display: flex; flex-direction: column; }
        .ann-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .ann-head h2 { font-family: var(--ch-font-serif); font-size: 1rem; color: var(--ch-primary); }
        .announcement-date { font-size: 0.74rem; color: #999; }
        .announcement-list { list-style: none; overflow-y: auto; max-height: 120px; }
        .announcement-list li { padding: 8px 0; border-bottom: 1px dashed #efe9dd; font-size: 0.82rem; line-height: 1.45; }
        .announcement-list li:last-child { border-bottom: none; }
        .announcement-list .tag { display: inline-block; font-size: 0.62rem; padding: 1px 7px; border-radius: 999px; margin-right: 6px; background: #eee; color: #555; }
        .announcement-list .tag.urgent { background: var(--ch-danger); color: #fff; }
        .announcement-list .tag.event { background: var(--ch-secondary); color: #2c1a00; }
        /* 問候磚（金，跨整列底部） */
        .tile-greet { grid-column: 1 / span 2; grid-row: 3; background: linear-gradient(135deg, var(--ch-secondary), var(--ch-secondary-dark)); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; }
        .tile-greet .g-main { font-family: var(--ch-font-serif); font-size: 1.05rem; }
        .tile-greet .g-foot { font-size: 0.72rem; color: rgba(255,255,255,0.85); }
        .back-link { position: fixed; top: 18px; left: 18px; z-index: 10; color: #fff; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); padding: 8px 14px; border-radius: 999px; text-decoration: none; font-size: 0.82rem; backdrop-filter: blur(4px); }
        @media (max-width: 820px) {
            .bento { grid-template-columns: 1fr; }
            .tile-brand, .tile-login, .tile-ann, .tile-greet { grid-column: 1; grid-row: auto; }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回款式選擇</a>
    <div id="bgLayer" class="bg-layer"></div>
    <div class="bg-overlay"></div>
    <div class="bento">
        <section class="tile tile-brand">
            <span id="brandLogo"><svg viewBox="0 0 56 56" width="48" height="48" fill="none"><circle cx="28" cy="28" r="25" stroke="#C19A6B" stroke-width="2" /><path d="M28 15v26M15 28h26" stroke="#C19A6B" stroke-width="4.5" stroke-linecap="round" /></svg></span>
            <div><p class="brand-eyebrow">CHENG HSIN GENERAL HOSPITAL</p><div class="company-name">振興醫院</div><p class="company-slogan">員工資訊整合入口</p><div class="festival-banner" id="festivalBanner" style="display:none"></div></div>
        </section>
        <section class="tile tile-login">
            <p class="login-eyebrow">WELCOME BACK</p>
            <h1 class="login-title">歡迎回來</h1>
            <p class="login-subtitle">請輸入帳號密碼以登入系統</p>
            <form id="loginForm" class="login-form" novalidate>
                <div><label class="field-label" for="username">帳號</label><div class="field-input"><input type="text" id="username" name="username" placeholder="員工編號或帳號" required /></div></div>
                <div><label class="field-label" for="password">密碼</label><div class="field-input"><input type="password" id="password" name="password" placeholder="請輸入密碼" required /><button type="button" class="toggle-password" id="togglePassword">顯示</button></div></div>
                <div class="field-row"><label class="checkbox"><input type="checkbox" id="remember" /><span>記住我</span></label><a href="#" class="link-forgot">忘記密碼？</a></div>
                <p class="form-message" id="formMessage" role="alert"></p>
                <button type="submit" class="btn-login">登 入</button>
            </form>
        </section>
        <section class="tile tile-ann">
            <div class="ann-head"><h2>系統公告</h2><span class="announcement-date" id="todayLabel"></span></div>
            <ul class="announcement-list" id="announcementList"></ul>
        </section>
        <section class="tile tile-greet">
            <span class="g-main" id="greeting"></span>
            <span class="g-foot">© <span id="year"></span> 振興醫院 Cheng Hsin General Hospital 版權所有</span>
        </section>
    </div>
    <script src="../shared/login-core.js"></script>
</body>
</html>
