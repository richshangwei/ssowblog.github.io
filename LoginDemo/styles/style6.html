<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>風格六：臨床編輯室｜振興醫院登入</title>
    <style>
        :root {
            --navy: #072f4f; --blue: #0d5f91; --red: #c73b32; --paper: #f4f1e9;
            --ink: #17212a; --muted: #65717a; --line: #c9c6bc; --ok: #39734c;
            --sans: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            --serif: "Noto Serif TC", "PMingLiU", serif;
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body { min-height: 100dvh; background: var(--paper); color: var(--ink); font-family: var(--sans); }
        .bg-layer { position: fixed; inset: 0; z-index: -2; background: var(--paper); }
        .bg-layer::before { content: ""; position: absolute; inset: 0; opacity: .34; background-image: linear-gradient(rgba(7,47,79,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(7,47,79,.09) 1px, transparent 1px); background-size: 28px 28px; }
        .bg-layer::after { content: ""; position: absolute; inset: 0 0 auto; height: 9px; background: var(--red); }
        .bg-layer.theme-tue, .bg-layer.theme-christmas { background: #edf3ef; }
        .bg-layer.theme-fri, .bg-layer.theme-anniversary { background: #f2eee5; }
        .bg-layer.theme-lunar, .bg-layer.theme-newyear { background: #f4e9e5; }
        .back-link { position: fixed; top: 24px; left: 28px; z-index: 5; color: var(--navy); font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-decoration: none; border-bottom: 2px solid var(--red); }
        .page { width: min(1180px, calc(100% - 48px)); min-height: 100dvh; margin: auto; padding: 78px 0 42px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(340px, .72fr); gap: 8vw; align-items: center; }
        .masthead { border-top: 4px solid var(--navy); padding-top: 18px; animation: enter .65s ease both; }
        .brand { display: flex; align-items: center; gap: 15px; }
        .brand svg { width: 48px; height: 48px; }
        .brand-logo-img { width: 190px; max-height: 54px; object-fit: contain; filter: brightness(.23) saturate(1.8); }
        .brand-en { margin: 0; color: var(--blue); font-size: .7rem; font-weight: 900; letter-spacing: .17em; }
        .company-name { margin-top: 2px; font-family: var(--serif); color: var(--navy); font-size: 1.55rem; font-weight: 800; letter-spacing: .16em; }
        h1 { max-width: 700px; margin: 52px 0 18px; color: var(--navy); font-family: var(--serif); font-size: clamp(3.5rem, 7vw, 7.2rem); line-height: .93; letter-spacing: -.055em; }
        h1 span { color: var(--red); }
        .lead { max-width: 520px; margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.9; }
        .meta { margin-top: 42px; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
        .meta > div { padding: 17px 0; }
        .meta > div + div { padding-left: 22px; border-left: 1px solid var(--line); }
        .meta b { display: block; color: var(--navy); font-size: .72rem; letter-spacing: .08em; }
        .meta span { color: var(--muted); font-size: .8rem; line-height: 1.6; }
        .panel { background: rgba(255,255,255,.76); border: 1px solid var(--line); box-shadow: 18px 18px 0 rgba(7,47,79,.11); animation: enter .65s .12s ease both; }
        .panel-head { padding: 28px 30px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: end; justify-content: space-between; }
        .panel-head h2 { margin: 0; color: var(--navy); font-family: var(--serif); font-size: 1.65rem; }
        .panel-head small { color: var(--red); font-weight: 900; letter-spacing: .13em; }
        .festival-banner { margin: 20px 30px 0; padding: 10px 0; border-bottom: 1px solid var(--red); color: var(--red); font-size: .82rem; font-weight: 800; }
        .festival-banner .fb-wish { margin-left: 8px; color: var(--muted); font-weight: 400; }
        form { padding: 27px 30px 24px; }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 7px; color: var(--navy); font-size: .75rem; font-weight: 900; letter-spacing: .08em; }
        .field-input { position: relative; }
        input[type="text"], input[type="password"] { width: 100%; padding: 13px 42px 13px 0; border: 0; border-bottom: 2px solid var(--navy); border-radius: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; }
        input:focus { border-color: var(--red); }
        .toggle-password { position: absolute; right: 0; bottom: 12px; border: 0; background: none; color: var(--blue); font-weight: 800; cursor: pointer; }
        .field-row { display: flex; justify-content: space-between; gap: 16px; font-size: .78rem; }
        .checkbox { display: flex; align-items: center; gap: 7px; color: var(--muted); }
        .checkbox input { accent-color: var(--red); }
        .link-forgot { color: var(--blue); font-weight: 700; text-decoration: none; }
        .form-message { min-height: 20px; margin: 14px 0 8px; color: var(--red); font-size: .78rem; }
        .form-message.success { color: var(--ok); }
        .btn-login { width: 100%; padding: 14px; border: 0; border-radius: 0; background: var(--navy); color: #fff; font: 800 .92rem var(--sans); letter-spacing: .3em; cursor: pointer; transition: transform .18s, background .18s; }
        .btn-login:hover { background: var(--red); transform: translateY(-2px); }
        .btn-login:active { transform: translateY(1px); }
        .ann { margin-top: 4px; padding: 22px 30px 28px; border-top: 4px solid var(--red); background: rgba(7,47,79,.045); }
        .ann-head { margin-bottom: 14px; display: flex; align-items: end; justify-content: space-between; gap: 18px; }
        .ann h3 { margin: 0; color: var(--navy); font-family: var(--serif); font-size: 1.2rem; letter-spacing: .06em; }
        .ann-date { color: var(--muted); font-size: .7rem; font-weight: 700; white-space: nowrap; }
        .announcement-list { max-height: 190px; margin: 0; padding: 0; overflow: auto; list-style: none; }
        .announcement-list li { padding: 10px 0; border-top: 1px solid var(--line); color: var(--ink); font-size: .8rem; line-height: 1.55; }
        .announcement-list li:first-child { padding: 13px 14px; border: 0; background: var(--navy); color: #fff; font-size: .88rem; font-weight: 700; }
        .announcement-list .tag { display: inline-block; margin-right: 7px; color: var(--red); font-weight: 900; }
        .announcement-list li:first-child .tag { padding: 2px 6px; background: var(--red); color: #fff; }
        @keyframes enter { from { opacity: 0; transform: translateY(18px); } }
        @media (max-width: 820px) { .page { width: min(100% - 32px, 580px); grid-template-columns: 1fr; gap: 48px; padding-top: 88px; } h1 { margin-top: 36px; } .panel { box-shadow: 10px 10px 0 rgba(7,47,79,.11); } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <a class="back-link" href="../index.html">返回款式選擇</a>
    <div id="bgLayer" class="bg-layer"></div>
    <main class="page">
        <section class="masthead">
            <div class="brand"><span id="brandLogo"><svg viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="25" stroke="#c73b32" stroke-width="2"/><path d="M28 15v26M15 28h26" stroke="#c73b32" stroke-width="5"/></svg></span><div><p class="brand-en">CHENG HSIN GENERAL HOSPITAL</p><div class="company-name">振興醫院</div></div></div>
            <h1>讓照護<br><span>持續前進。</span></h1>
            <p class="lead">安全登入員工資訊整合入口，快速連結臨床、行政與院內服務。</p>
            <div class="meta"><div><b>今日值勤</b><span id="greeting"></span></div><div><b>系統日期</b><span id="todayLabel"></span></div></div>
        </section>
        <section class="panel" aria-labelledby="loginTitle">
            <div class="panel-head"><h2 id="loginTitle">員工登入</h2><small>SECURE ACCESS</small></div>
            <div class="festival-banner" id="festivalBanner" style="display:none"></div>
            <form id="loginForm" novalidate>
                <div class="field"><label for="username">帳號 ACCOUNT</label><div class="field-input"><input id="username" name="username" type="text" autocomplete="username" placeholder="員工編號或帳號" required></div></div>
                <div class="field"><label for="password">密碼 PASSWORD</label><div class="field-input"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required><button class="toggle-password" id="togglePassword" type="button">顯示</button></div></div>
                <div class="field-row"><label class="checkbox"><input id="remember" type="checkbox">記住我</label><a class="link-forgot" href="#">忘記密碼？</a></div>
                <p class="form-message" id="formMessage" role="alert"></p>
                <button class="btn-login" type="submit">登 入</button>
            </form>
            <aside class="ann"><div class="ann-head"><h3>院內重要公告</h3><span class="ann-date" id="todayLabelAnn"></span></div><ul class="announcement-list" id="announcementList"></ul></aside>
        </section>
    </main>
    <script src="../shared/login-core.js"></script>
</body>
</html>
