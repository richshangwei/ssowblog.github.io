<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>風格十三：字體優先｜振興醫院登入</title>
    <link rel="stylesheet" href="../shared/login-trends.css">
</head>
<body class="trend-type">
    <a class="back-link" href="../index.html">返回款式選擇</a><div id="bgLayer" class="bg-layer"></div><div class="decor"></div>
    <main class="portal">
        <section class="info">
            <div class="brand"><span id="brandLogo"><svg viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="25" stroke="#e8472e" stroke-width="2"/><path d="M28 15v26M15 28h26" stroke="#e8472e" stroke-width="5"/></svg></span><div><div class="company-name">振興醫院</div><p class="brand-en">CHENG HSIN GENERAL HOSPITAL</p></div></div>
            <div class="hero"><p class="eyebrow">TYPE-FIRST INFORMATION DESIGN</p><h1>登入<br>之前</h1><p>先掌握今日院內資訊，再進入工作系統。以字體層級取代不必要裝飾。</p></div>
            <aside class="announcement"><div class="announcement-head"><h2 class="announcement-title">公告即入口</h2><span class="announcement-date" id="todayLabelAnn"></span></div><ul class="announcement-list" id="announcementList"></ul></aside>
        </section>
        <section class="access">
            <div class="festival-banner" id="festivalBanner" style="display:none"></div><p class="login-kicker">STAFF PORTAL</p><h1 class="login-title">員工身分驗證</h1><p class="login-subtitle" id="greeting"></p>
            <form class="login-form" id="loginForm" novalidate>
                <div><label class="field-label" for="username">01 帳號</label><div class="field-input"><input id="username" name="username" type="text" autocomplete="username" placeholder="員工編號或帳號" required></div></div>
                <div><label class="field-label" for="password">02 密碼</label><div class="field-input"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required><button class="toggle-password" id="togglePassword" type="button">顯示</button></div></div>
                <div class="field-row"><label class="checkbox"><input type="checkbox">記住我</label><a class="link-forgot" href="#">忘記密碼？</a></div><p class="form-message" id="formMessage" role="alert"></p><button class="btn-login" type="submit">進入工作系統</button>
            </form><div class="access-foot"><span id="todayLabel"></span><br>© <span id="year"></span> 振興醫院</div>
        </section>
    </main><script src="../shared/login-core.js"></script>
</body>
</html>
