<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P10 共用工作站｜共用系統登入入口（原型）</title>
    <link rel="stylesheet" href="../assets/libs/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/libs/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="assets/portal-base.css" />
    <style>
        /* ===== P10 共用工作站 Shared Workstation ============================
           情境：護理站、櫃台、值班室的共用電腦；站著操作、觸控、螢幕可能偏舊
           版面結構：單欄、由上而下只有三段：登入 → 現在受影響的事 → 求助
           登入區位置：第一屏最上方，佔滿寬度，欄位與按鈕都放大
           公告呈現：只顯示會影響操作的一則，其餘收在「查看全部公告」大按鈕
           導覽方式：無導覽，減少誤觸
           視覺語言：18px 起跳、高對比、粗邊框、觸控目標 ≥ 56px
           ================================================================= */
        :root { --pt-brand: #0b3d91; --pt-line: #b9c4d0; }

        html { font-size: 18px; }
        body { background: #fff; }

        .p-head { background: #10233d; color: #fff; }
        .p-head-inner { max-width: 900px; margin: 0 auto; padding: 1rem; }
        .p-head .pt-purpose { color: #c3d4e8; }
        .p-head .pt-logo { color: #fff; width: 64px; height: 64px; flex-basis: 64px; }
        .p-head .pt-portal-name { font-size: 1.9rem; }

        .p-warn {
            background: #ffe9a8; border-bottom: 4px solid #a86a00; color: #4a3000;
            font-weight: 700; text-align: center; padding: .6rem 1rem; font-size: 1rem;
        }

        .p-wrap { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }

        .p-block { border: 3px solid var(--pt-ink); border-radius: .4rem; padding: 1.2rem 1.3rem; margin-bottom: 1.25rem; }
        .p-block > h2 {
            font-size: 1.35rem; font-weight: 800; margin: -1.2rem -1.3rem 1rem;
            padding: .6rem 1.3rem; background: var(--pt-ink); color: #fff;
        }

        /* 放大表單元件（觸控） */
        .p-wrap .pt-label { font-size: 1.1rem; }
        .p-wrap .pt-input { font-size: 1.15rem; padding: .85rem .9rem; border-width: 2px; border-radius: .35rem; min-height: 60px; }
        .p-wrap .pt-toggle { min-height: 60px; font-size: 1rem; border-width: 2px; padding: 0 1rem; }
        .p-wrap .pt-submit { min-height: 64px; font-size: 1.2rem; border-radius: .35rem; }
        .p-wrap .pt-check input { width: 1.5rem; height: 1.5rem; }
        .p-wrap .pt-check { font-size: 1rem; padding: .3rem 0; }
        .p-wrap .pt-form-links { gap: .6rem 1.2rem; font-size: 1rem; }
        .p-wrap .pt-form-links a { min-height: 44px; display: inline-flex; align-items: center; }
        .p-wrap .pt-err { font-size: 1rem; }
        .p-wrap .pt-form-msg { font-size: 1rem; }

        .p-bigbtns { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; }
        .p-bigbtn {
            display: flex; gap: .7rem; align-items: center; min-height: 64px;
            border: 3px solid var(--pt-brand); border-radius: .35rem; background: #fff;
            color: var(--pt-brand); font-weight: 800; font-size: 1.05rem; text-decoration: none;
            padding: .6rem 1rem; cursor: pointer; font-family: inherit;
        }
        .p-bigbtn:hover { background: var(--pt-brand); color: #fff; }
        .p-bigbtn i { font-size: 1.5rem; }

        .p-contact { border: 3px dashed var(--pt-ink); border-radius: .4rem; padding: 1rem 1.1rem; margin-top: 1rem; font-size: 1.05rem; }
        .p-contact strong { font-size: 1.15rem; }

        .p-wrap .pt-notice-compact li { padding: .6rem 0; font-size: 1rem; }
        .p-wrap .pt-status-lines li { padding: .5rem 0; font-size: 1rem; }
        .p-wrap .pt-status { font-size: .95rem; padding: .2rem .7rem; }

        .p-foot { border-top: 3px solid var(--pt-ink); }
        .p-foot-inner { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem; font-size: .95rem; }

        @media (max-width: 575.98px) {
            html { font-size: 17px; }
            .p-bigbtns { grid-template-columns: 1fr; }
            .p-block { padding: 1rem; }
            .p-block > h2 { margin: -1rem -1rem .9rem; padding: .5rem 1rem; font-size: 1.2rem; }
        }
    </style>
</head>

<body>
    <a class="pt-skip" href="#ptForm">跳到登入表單</a>

    <header class="p-head">
        <div class="p-head-inner" id="slotIdentity"></div>
    </header>

    <p class="p-warn"><i class="bi bi-people-fill" aria-hidden="true"></i> 這是共用電腦，請勿勾選「保持登入」；使用完畢請登出並關閉瀏覽器。</p>

    <main class="p-wrap">
        <div id="slotAlerts"></div>

        <section class="p-block">
            <h2>登入</h2>
            <div id="slotLogin"></div>
            <div id="slotResult"></div>
        </section>

        <section class="p-block">
            <h2>現在有沒有影響操作的事</h2>
            <div id="slotStatus"></div>
            <div class="mt-3" id="slotNotices"></div>
        </section>

        <section class="p-block">
            <h2>需要協助</h2>
            <div class="p-bigbtns">
                <button class="p-bigbtn" type="button" data-pt-help="forgot"><i class="bi bi-key" aria-hidden="true"></i>忘記密碼</button>
                <button class="p-bigbtn" type="button" data-pt-help="perm"><i class="bi bi-shield-check" aria-hidden="true"></i>沒有系統權限</button>
                <button class="p-bigbtn" type="button" data-pt-help="faq"><i class="bi bi-question-circle" aria-hidden="true"></i>常見問題</button>
                <button class="p-bigbtn" type="button" data-pt-help="report"><i class="bi bi-megaphone" aria-hidden="true"></i>問題回報</button>
            </div>
            <div class="p-contact">
                <p class="mb-1"><strong>[資訊室／維護單位]</strong></p>
                <p class="mb-1">分機 <strong>[資訊室分機]</strong>　外線 [外線電話]</p>
                <p class="mb-1">服務時段：[服務時段]</p>
                <p class="mb-0">非服務時段：[非服務時段值班聯絡方式]</p>
            </div>
        </section>
    </main>

    <footer class="p-foot">
        <div class="p-foot-inner" id="slotFooter"></div>
    </footer>

    <script src="../assets/libs/jquery/jquery.min.js"></script>
    <script src="../assets/libs/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="assets/portal-data.js"></script>
    <script src="assets/portal-core.js"></script>
    <script>
        jQuery(function ($) {
            Portal.mount({
                slots: {
                    identity: '#slotIdentity', alerts: '#slotAlerts', login: '#slotLogin', result: '#slotResult',
                    status: '#slotStatus', notices: '#slotNotices', footer: '#slotFooter'
                },
                variants: { status: 'banner', notices: 'compact' },
                noticeLimit: 2,
                afterRender: function () {
                    /* 共用工作站情境：預設不記住帳號、不保持登入 */
                    $('#ptRemember, #ptKeep').prop('checked', false);
                }
            });
        });
    </script>
</body>

</html>
