<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P04 側欄導覽｜共用系統登入入口（原型）</title>
    <!-- Bootstrap 5 CSS（CDN優先，本機為備援） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" onerror="this.onerror=null;this.href='../assets/libs/bootstrap/bootstrap.min.css';">
    <!-- Bootstrap Icons（CDN優先，本機為備援） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" onerror="this.onerror=null;this.href='../assets/libs/bootstrap-icons/bootstrap-icons.css';">
    <link rel="stylesheet" href="assets/portal-base.css" />
    <style>
        /* ===== P04 側欄導覽 Sidebar Portal ==================================
           版面結構：左側固定導覽 + 右側單一內容區，一次只看一件事
           登入區位置：預設分頁「登入」，其他分頁不會擠壓登入版面
           公告呈現：表格（可比較程度、適用系統與更新時間），適合公告多的單位
           導覽方式：側欄分頁切換（真正的導覽，非捲動）
           視覺語言：淺色內容區 + 深色側欄，接近行政系統的操作習慣
           ================================================================= */
        :root { --pt-brand: #14496f; }

        .p-shell { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }

        .p-side { background: #12293d; color: #dce9f3; padding: 1rem .85rem; }
        .p-side .pt-identity { gap: .7rem; margin-bottom: 1rem; }
        .p-side .pt-logo { width: 42px; height: 42px; flex-basis: 42px; font-size: .68rem; }
        .p-side .pt-org { font-size: .82rem; }
        .p-side .pt-portal-name { font-size: 1.02rem; }
        .p-side .pt-purpose { display: none; }

        .p-nav { list-style: none; margin: 0 0 1rem; padding: .75rem 0 0; border-top: 1px solid rgba(255, 255, 255, .14); }
        .p-nav button {
            width: 100%; display: flex; gap: .6rem; align-items: center; text-align: left;
            font: inherit; font-size: .95rem; font-weight: 600; cursor: pointer;
            padding: .6rem .7rem; margin-bottom: .15rem; min-height: 44px;
            border: none; border-radius: .4rem; background: transparent; color: #cfe0ee;
        }
        .p-nav button:hover { background: rgba(255, 255, 255, .09); color: #fff; }
        .p-nav button[aria-current="true"] { background: #2f7bbd; color: #fff; }
        .p-nav .p-badge { margin-left: auto; background: #b03a2e; color: #fff; border-radius: 999px; font-size: .74rem; padding: 0 .45rem; font-weight: 700; }

        .p-side-foot { font-size: .78rem; color: #9fbdd2; border-top: 1px solid rgba(255, 255, 255, .14); padding-top: .75rem; }
        .p-side-foot p { margin: 0 0 .2rem; }

        .p-main { background: var(--pt-bg); padding: 1.25rem 1.5rem 2.5rem; }
        .p-main-inner { max-width: 940px; }
        .p-panel { background: #fff; border: 1px solid var(--pt-line); border-radius: .6rem; padding: 1.25rem 1.4rem; }
        .p-panel h2 { font-size: 1.25rem; font-weight: 800; margin: 0 0 .3rem; }
        .p-panel .p-lead { color: var(--pt-muted); font-size: .92rem; margin: 0 0 1.1rem; }
        .p-login-wrap { max-width: 460px; }

        .p-foot { margin-top: 1.25rem; background: #fff; border: 1px solid var(--pt-line); border-radius: .6rem; padding: 1.1rem 1.3rem; }

        @media (max-width: 991.98px) {
            .p-shell { grid-template-columns: 1fr; }
            .p-side { padding: .9rem 1rem; }
            .p-nav { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .75rem; }
            .p-nav li { flex: 1 1 auto; }
            .p-nav button { margin-bottom: 0; }
            .p-main { padding: 1rem 1rem 2rem; }
            .p-panel { padding: 1rem; }
        }
    </style>
</head>

<body>
    <a class="pt-skip" href="#ptForm">跳到登入表單</a>

    <div class="p-shell">
        <nav class="p-side" aria-label="入口導覽">
            <div id="slotIdentity"></div>
            <ul class="p-nav">
                <li><button type="button" data-view="login" aria-current="true"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>登入</button></li>
                <li><button type="button" data-view="notices"><i class="bi bi-megaphone" aria-hidden="true"></i>公告<span class="p-badge" id="pNoticeCount">0</span></button></li>
                <li><button type="button" data-view="status"><i class="bi bi-activity" aria-hidden="true"></i>服務狀態</button></li>
                <li><button type="button" data-view="systems"><i class="bi bi-grid" aria-hidden="true"></i>可進入的系統</button></li>
                <li><button type="button" data-view="help"><i class="bi bi-life-preserver" aria-hidden="true"></i>需要協助</button></li>
            </ul>
            <div class="p-side-foot">
                <p>[資訊室／維護單位]</p>
                <p>分機 [資訊室分機]</p>
                <p>[服務時段]</p>
            </div>
        </nav>

        <main class="p-main">
            <div class="p-main-inner">
                <div id="slotAlerts"></div>

                <section class="p-panel" data-pane="login">
                    <h2>登入</h2>
                    <p class="p-lead">請使用 [組織名稱] 核發的公務帳號。若不確定服務是否正常，可先看左側「服務狀態」。</p>
                    <div class="p-login-wrap">
                        <div id="slotLogin"></div>
                        <div id="slotResult"></div>
                    </div>
                </section>

                <section class="p-panel" data-pane="notices" hidden>
                    <h2>公告</h2>
                    <p class="p-lead">依重要程度排序。點選標題可看完整說明（影響、時間、處理狀態、可採取的行動與替代方式）。</p>
                    <div id="slotNotices"></div>
                </section>

                <section class="p-panel" data-pane="status" hidden>
                    <h2>服務狀態</h2>
                    <p class="p-lead">此處僅顯示可公開的服務狀態；沒有資料時顯示「狀態未確認」。</p>
                    <div id="slotStatus"></div>
                </section>

                <section class="p-panel" data-pane="systems" hidden>
                    <h2>可進入的系統</h2>
                    <p class="p-lead">登入前僅列出可公開的系統，實際可用清單以您的權限為準。</p>
                    <div id="slotSystems"></div>
                </section>

                <section class="p-panel" data-pane="help" hidden>
                    <h2>需要協助</h2>
                    <p class="p-lead">以下入口都不需要登入即可使用。</p>
                    <div id="slotHelp"></div>
                </section>

                <div class="p-foot" id="slotFooter"></div>
            </div>
        </main>
    </div>

    <!-- jQuery（CDN優先，本機為備援） -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="../assets/libs/jquery/jquery.min.js"><\/script>');</script>
    <!-- Bootstrap 5 JS（CDN優先，本機為備援） -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.bootstrap || document.write('<script src="../assets/libs/bootstrap/bootstrap.bundle.min.js"><\/script>');</script>
    <script src="assets/portal-data.js"></script>
    <script src="assets/portal-core.js"></script>
    <script>
        jQuery(function ($) {
            var api = Portal.mount({
                slots: {
                    identity: '#slotIdentity', alerts: '#slotAlerts', login: '#slotLogin', result: '#slotResult',
                    status: '#slotStatus', notices: '#slotNotices', help: '#slotHelp',
                    systems: '#slotSystems', footer: '#slotFooter'
                },
                variants: { status: 'table', notices: 'table', help: 'cards', systems: 'table' },
                noticeLimit: 0,
                afterRender: function () {
                    $('#pNoticeCount').text($('#slotNotices tbody tr').length);
                }
            });

            $('.p-nav button').on('click', function () {
                var v = $(this).data('view');
                $('.p-nav button').attr('aria-current', 'false');
                $(this).attr('aria-current', 'true');
                $('[data-pane]').prop('hidden', true).filter('[data-pane="' + v + '"]').prop('hidden', false);
                if (v === 'login') { $('#ptAccount').trigger('focus'); }
            });
        });
    </script>
</body>

</html>
