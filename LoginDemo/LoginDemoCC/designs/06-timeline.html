<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>款式 06｜時間軸</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          onerror="this.onerror=null;this.href='../assets/libs/bootstrap/bootstrap.min.css';" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          onerror="this.onerror=null;this.href='../assets/libs/bootstrap-icons/bootstrap-icons.css';" />
    <style>
        /* ===== 款式 06：時間軸 Timeline =====================================
           公告與更版本質上都是「哪一天發生什麼」，所以合併成一條時間軸，
           依日期由新到舊排列，可切換只看公告／只看更版／全部。
           登入端最後登入紀錄也是時間軸上的一個點。
           ================================================================= */
        :root {
            --ink: #1b2430; --muted: #667586; --line: #e1e7ee; --brand: #2a4d69; --accent: #d98324;
        }
        body {
            margin: 0; background: #f7f9fb; color: var(--ink);
            font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        }
        a { text-decoration: none; }

        .topbar { background: var(--brand); color: #fff; }
        .code { font-family: Consolas, monospace; letter-spacing: .07em; border: 1px solid rgba(255,255,255,.4); border-radius: .3rem; padding: .1rem .5rem; font-size: .82rem; }
        .env { background: #16643f; border-radius: .3rem; padding: .1rem .55rem; font-weight: 800; font-size: .8rem; letter-spacing: .08em; }

        .card-plain { background: #fff; border: 1px solid var(--line); border-radius: .6rem; }

        .form-control { padding: .75rem .85rem; border-color: var(--line); }
        .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(42,77,105,.18); }
        .form-label { font-weight: 700; font-size: .85rem; color: var(--muted); }
        .input-group-text { background: #fff; border-color: var(--line); cursor: pointer; color: var(--muted); }
        .btn-go { background: var(--brand); color: #fff; font-weight: 800; padding: .75rem; border: none; }
        .btn-go:hover { background: #1b3449; color: #fff; }

        /* 時間軸 */
        .tl { position: relative; padding-left: 2.2rem; }
        .tl::before { content: ''; position: absolute; left: .72rem; top: .3rem; bottom: .3rem; width: 2px; background: var(--line); }
        .tl-item { position: relative; padding-bottom: 1.1rem; }
        .tl-item::before {
            content: ''; position: absolute; left: -1.72rem; top: .45rem;
            width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--muted);
        }
        .tl-item.k-danger::before { border-color: #b42318; }
        .tl-item.k-warning::before { border-color: #9a5b13; }
        .tl-item.k-info::before { border-color: #0b6bcb; }
        .tl-item.k-success::before { border-color: #167044; }
        .tl-item.k-release::before { border-color: var(--accent); background: var(--accent); }
        .tl-item.k-login::before { border-color: var(--brand); background: var(--brand); }

        .tl-date { font-size: .78rem; color: var(--muted); font-family: Consolas, monospace; letter-spacing: .04em; }
        .tl-card { background: #fff; border: 1px solid var(--line); border-radius: .55rem; padding: .8rem .95rem; margin-top: .2rem; }
        .tl-card h3 { font-size: 1rem; font-weight: 700; margin: .25rem 0 .35rem; }
        .tl-card p { font-size: .9rem; margin: 0 0 .35rem; }
        .meta { font-size: .78rem; color: var(--muted); }

        .chip { font-size: .72rem; border-radius: 999px; padding: .05rem .55rem; border: 1px solid var(--line); }
        .chip-GLOBAL { background: #e8f1fb; color: #0b4f9e; }
        .chip-SYSTEM { background: #fdf2e3; color: #7a5322; }
        .chip-rel { background: #fdf2e3; color: #8a5312; border-color: #ecd9b8; }

        .rel-list { list-style: none; margin: .3rem 0 0; padding: 0; }
        .rel-item { display: flex; gap: .5rem; font-size: .88rem; padding: .15rem 0; }
        .rel-tag { font-size: .7rem; font-weight: 700; border-radius: .25rem; padding: 0 .4rem; white-space: nowrap; height: 1.3rem; }
        .t-feature { background: #e3f0ff; color: #0b4f9e; }
        .t-fix { background: #fdecea; color: #96201a; }
        .t-security { background: #ede9fe; color: #5b21b6; }
        .t-change { background: #eef3f7; color: #46545f; }

        .kv { display: flex; justify-content: space-between; gap: .8rem; padding: .32rem 0; border-bottom: 1px dashed var(--line); font-size: .86rem; }
        .kv:last-child { border-bottom: none; }
        .kv .k { color: var(--muted); white-space: nowrap; }
        .kv .v { font-weight: 600; text-align: right; word-break: break-word; }

        .help-item { display: flex; gap: .6rem; padding: .5rem 0; border-top: 1px solid var(--line); color: var(--ink); }
        .help-item:first-child { border-top: none; }
        .help-item i { color: var(--accent); font-size: 1.1rem; }
        .help-item small { display: block; color: var(--muted); }

        .sticky-col { position: sticky; top: 1rem; }
        @media (max-width: 991.98px) { .sticky-col { position: static; } }
    </style>
</head>

<body>

    <div class="topbar py-2">
        <div class="container d-flex flex-wrap align-items-center gap-2">
            <i class="bi bi-hospital"></i>
            <strong id="sysName">—</strong>
            <span class="code" id="sysCode">—</span>
            <span class="env" id="sysEnv">—</span>
            <span class="ms-auto small opacity-75"><span id="org">—</span>　<span id="clock">—</span></span>
        </div>
    </div>

    <main class="container py-4">
        <div class="row g-4">

            <!-- 左：登入 + 系統資訊 -->
            <div class="col-12 col-lg-4">
                <div class="sticky-col">
                    <div class="card-plain p-4 mb-3">
                        <p class="small text-secondary mb-1">您正在登入</p>
                        <h1 class="h4 fw-bold mb-3" id="heroName">—</h1>
                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label class="form-label" for="account">帳號（員工編號）</label>
                                <input type="text" class="form-control" id="account" placeholder="例如：A12345" autocomplete="username" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="password">密碼</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" placeholder="請輸入密碼" autocomplete="current-password" />
                                    <span class="input-group-text" id="tp" role="button" tabindex="0" aria-label="顯示密碼"><i class="bi bi-eye" id="tpi"></i></span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rm" />
                                    <label class="form-check-label small text-secondary" for="rm">記住此電腦</label>
                                </div>
                                <div class="small"><a href="#">忘記密碼</a><span class="text-secondary mx-1">·</span><a href="#">變更密碼</a></div>
                            </div>
                            <div id="msg" class="alert py-2 px-3 small d-none"></div>
                            <button class="btn btn-go w-100" type="submit">登入 <span id="short"></span></button>
                        </form>
                    </div>

                    <div class="card-plain p-3 mb-3">
                        <h2 class="h6 fw-bold mb-2"><i class="bi bi-pc-display me-1"></i>登入端電腦</h2>
                        <div id="clientRows"></div>
                        <div class="alert alert-warning py-2 px-3 small mt-2 mb-0 d-none" id="failBox"></div>
                    </div>

                    <div class="accordion" id="sideAcc">
                        <div class="accordion-item">
                            <h2 class="accordion-header"><button class="accordion-button collapsed py-2" data-bs-toggle="collapse" data-bs-target="#s1">版本資訊</button></h2>
                            <div id="s1" class="accordion-collapse collapse" data-bs-parent="#sideAcc"><div class="accordion-body" id="sysRows"></div></div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header"><button class="accordion-button collapsed py-2" data-bs-toggle="collapse" data-bs-target="#s2">維護者與聯絡方式</button></h2>
                            <div id="s2" class="accordion-collapse collapse" data-bs-parent="#sideAcc"><div class="accordion-body" id="maintRows"></div></div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header"><button class="accordion-button collapsed py-2" data-bs-toggle="collapse" data-bs-target="#s3">教學與說明</button></h2>
                            <div id="s3" class="accordion-collapse collapse" data-bs-parent="#sideAcc"><div class="accordion-body" id="helpList"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右：時間軸 -->
            <div class="col-12 col-lg-8">
                <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                    <h2 class="h5 fw-bold mb-0"><i class="bi bi-clock-history me-1"></i>系統動態時間軸</h2>
                    <div class="btn-group btn-group-sm ms-auto">
                        <button class="btn btn-outline-secondary active" data-filter="ALL">全部</button>
                        <button class="btn btn-outline-secondary" data-filter="GLOBAL">全系統公告</button>
                        <button class="btn btn-outline-secondary" data-filter="SYSTEM">本系統公告</button>
                        <button class="btn btn-outline-secondary" data-filter="RELEASE">更版</button>
                    </div>
                </div>
                <div class="tl" id="timeline"></div>
            </div>
        </div>

        <p class="text-secondary small mt-4 mb-0" id="footer">—</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="../assets/libs/jquery/jquery.min.js"><\/script>');</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.bootstrap || document.write('<script src="../assets/libs/bootstrap/bootstrap.bundle.min.js"><\/script>');</script>
    <script src="../assets/js/data.js"></script>
    <script src="shared.js"></script>
    <script>
        jQuery(function ($) {
            var C = LD.cfg, I = LD.identity(), c = C.client || {};
            LD.applyEnv();
            LD.fill({
                '#sysName': I.name, '#heroName': I.name, '#sysCode': I.code, '#sysEnv': I.envText,
                '#org': I.org, '#short': I.short ? '（' + I.short + '）' : '', '#footer': I.footer
            });
            LD.startClock(function (t) { $('#clock').text(t.date + '　' + t.time); });

            $('#sysRows').html(LD.kvHtml(LD.systemRows()));
            $('#maintRows').html(LD.kvHtml(LD.maintainerRows(), 'kv', true));
            $('#clientRows').html(LD.kvHtml(LD.clientItems().map(function (i) { return [i.label, i.value]; })));
            $('#helpList').html(LD.helpHtml());

            var ft = LD.failedLoginText();
            if (ft) { $('#failBox').removeClass('d-none').text(ft); }

            /* 把公告、更版、最後登入合併成一條時間軸 */
            function buildEvents() {
                var ev = [];
                LD.notices('ALL').forEach(function (n) {
                    ev.push({
                        date: n.date, kind: 'NOTICE', scope: n.scope, cls: 'k' + '-' + n.level,
                        html: '<div class="tl-card">' +
                            '<div class="d-flex flex-wrap align-items-center gap-2">' +
                            (n.pinned ? '<i class="bi bi-pin-angle-fill text-danger"></i>' : '') +
                            '<span class="badge text-bg-' + LD.esc(n.level) + '">' + LD.esc(n.levelName) + '</span>' +
                            '<span class="chip chip-' + LD.esc(n.scope) + '">' + LD.esc(n.scopeName) + '</span></div>' +
                            '<h3>' + LD.esc(n.title) + '</h3><p>' + LD.esc(n.content) + '</p>' +
                            '<div class="meta">' + LD.esc(n.publisher) + ' · ' + LD.esc(n.id) + '</div></div>'
                    });
                });
                (C.releases || []).forEach(function (r) {
                    ev.push({
                        date: r.date, kind: 'RELEASE', cls: 'k-release',
                        html: '<div class="tl-card">' +
                            '<div class="d-flex flex-wrap align-items-center gap-2">' +
                            '<span class="chip chip-rel">更版</span>' +
                            '<strong style="font-family:Consolas,monospace">' + LD.esc(r.version) + '</strong>' +
                            (r.current ? '<span class="badge text-bg-success">目前版本</span>' : '') + '</div>' +
                            '<h3>' + LD.esc(r.summary || '') + '</h3>' +
                            '<ul class="rel-list">' + (r.items || []).map(function (i) {
                                return '<li class="rel-item"><span class="rel-tag t-' + LD.esc(i.type) + '">' +
                                    LD.esc(LD.TYPE_NAME[i.type] || i.type) + '</span><span>' + LD.esc(i.text) + '</span></li>';
                            }).join('') + '</ul></div>'
                    });
                });
                var ll = c.lastLogin || {};
                if (ll.time) {
                    ev.push({
                        date: (ll.time || '').slice(0, 10), kind: 'LOGIN', cls: 'k-login',
                        html: '<div class="tl-card">' +
                            '<div class="d-flex flex-wrap align-items-center gap-2"><span class="chip">登入紀錄</span></div>' +
                            '<h3>最後一次登入' + (ll.result === 'success' ? '（成功）' : '（失敗）') + '</h3>' +
                            '<div>' + LD.kvHtml(LD.lastLoginRows()) + '</div></div>'
                    });
                }
                return ev.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
            }

            var EVENTS = buildEvents();

            function render(filter) {
                var list = EVENTS.filter(function (e) {
                    if (filter === 'ALL') { return true; }
                    if (filter === 'RELEASE') { return e.kind === 'RELEASE'; }
                    return e.kind === 'NOTICE' && e.scope === filter;
                });
                $('#timeline').html(list.length ? list.map(function (e) {
                    return '<div class="tl-item ' + e.cls + '"><div class="tl-date">' + LD.esc(e.date) + '</div>' + e.html + '</div>';
                }).join('') : '<p class="text-secondary small">沒有符合條件的項目。</p>');
            }
            render('ALL');
            $('[data-filter]').on('click', function () {
                $('[data-filter]').removeClass('active'); $(this).addClass('active');
                render($(this).data('filter'));
            });

            LD.bindPasswordToggle('#password', '#tp', '#tpi');
            LD.bindDemoLogin('#loginForm', '#account', '#password', function (m, t) {
                $('#msg').removeClass('d-none alert-warning alert-info').addClass('alert-' + t).text(m);
            });
        });
    </script>
</body>

</html>
