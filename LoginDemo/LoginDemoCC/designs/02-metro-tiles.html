<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>款式 02｜磁磚看板</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          onerror="this.onerror=null;this.href='../assets/libs/bootstrap/bootstrap.min.css';" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          onerror="this.onerror=null;this.href='../assets/libs/bootstrap-icons/bootstrap-icons.css';" />
    <style>
        /* ===== 款式 02：磁磚看板 Metro Tiles ================================
           所有資訊都是一塊色磚，登入是最大的那一塊。
           直角、實色、零陰影；用顏色而非位置來分類資訊。
           ================================================================= */
        :root {
            --ink: #16202b; --muted: #5d6e80; --line: #dde4ec;
            --t-brand: #12496f; --t-login: #ffffff; --t-notice: #b23a2e;
            --t-release: #1f6f4a; --t-sys: #2c3e50; --t-help: #8a5a12; --t-client: #4a4a6a;
        }
        body {
            margin: 0; background: #e9eef3; color: var(--ink);
            font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        }
        a { text-decoration: none; }

        .grid {
            display: grid; gap: 10px; padding: 10px;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: minmax(140px, auto);
            align-items: start;
            max-width: 1500px; margin: 0 auto;
        }
        .tile { padding: 1.1rem 1.2rem; color: #fff; overflow: hidden; display: flex; flex-direction: column; align-self: start; }
        .tile h2 {
            font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
            opacity: .85; margin: 0 0 .6rem; display: flex; align-items: center; gap: .4rem;
        }

        .t-brand { grid-column: span 6; background: var(--t-brand); }
        .t-login { grid-column: span 2; background: var(--t-login); color: var(--ink); border: 1px solid var(--line); }
        .t-notice { grid-column: span 4; background: var(--t-notice); }
        .t-release { grid-column: span 3; background: var(--t-release); }
        .t-sys { grid-column: span 3; background: var(--t-sys); }
        .t-client { grid-column: span 3; background: var(--t-client); }
        .t-help { grid-column: span 3; background: var(--t-help); }

        .brand-name { font-size: 2.1rem; font-weight: 800; line-height: 1.15; }
        .code { font-family: Consolas, monospace; letter-spacing: .1em; border: 1px solid rgba(255,255,255,.45); border-radius: .3rem; padding: .15rem .55rem; }
        .env { background: #0f6d47; padding: .15rem .6rem; font-weight: 800; letter-spacing: .1em; }

        .form-control { padding: .7rem .8rem; border-color: var(--line); border-radius: 0; }
        .form-control:focus { border-color: var(--t-brand); box-shadow: 0 0 0 .2rem rgba(18,73,111,.18); }
        .form-label { font-weight: 700; font-size: .82rem; color: var(--muted); }
        .input-group-text { border-radius: 0; background: #f4f7fa; border-color: var(--line); cursor: pointer; color: var(--muted); }
        .btn-go { background: var(--t-brand); color: #fff; font-weight: 800; padding: .7rem; border: none; border-radius: 0; }
        .btn-go:hover { background: #0b3350; color: #fff; }

        .scroll { overflow-y: auto; max-height: 560px; padding-right: .3rem; }
        .scroll::-webkit-scrollbar { width: 6px; }
        .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.4); }

        .n-item { border-top: 1px solid rgba(255,255,255,.25); padding: .6rem 0; }
        .n-item:first-child { border-top: none; padding-top: 0; }
        .n-item .t { font-weight: 700; font-size: .95rem; }
        .n-item .c { font-size: .84rem; opacity: .9; }
        .n-item .m { font-size: .74rem; opacity: .75; }
        .chip { font-size: .68rem; border: 1px solid rgba(255,255,255,.5); padding: 0 .4rem; }
        .chip-solid { background: rgba(255,255,255,.22); }

        .rel-block { border-top: 1px solid rgba(255,255,255,.25); padding: .55rem 0; }
        .rel-block:first-child { border-top: none; padding-top: 0; }
        .rel-head { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; }
        .rel-ver { font-family: Consolas, monospace; font-weight: 800; }
        .rel-now { background: rgba(255,255,255,.25); font-size: .68rem; padding: 0 .35rem; }
        .rel-date, .rel-sum { font-size: .76rem; opacity: .8; }
        .rel-list { list-style: none; margin: .3rem 0 0; padding: 0; }
        .rel-item { display: flex; gap: .45rem; font-size: .82rem; padding: .15rem 0; opacity: .95; }
        .rel-tag { font-size: .66rem; font-weight: 700; padding: 0 .3rem; background: rgba(255,255,255,.22); white-space: nowrap; height: 1.2rem; }

        .kv { display: flex; justify-content: space-between; gap: .7rem; padding: .22rem 0; font-size: .82rem; border-bottom: 1px solid rgba(255,255,255,.16); }
        .kv:last-child { border-bottom: none; }
        .kv .k { opacity: .78; white-space: nowrap; }
        .kv .v { font-weight: 700; text-align: right; word-break: break-word; }

        .help-item { display: flex; gap: .5rem; align-items: center; color: #fff; padding: .3rem 0; font-size: .86rem; }
        .help-item:hover { color: #fff; text-decoration: underline; }
        .help-item small { display: none; }

        @media (max-width: 1199.98px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
            .t-brand { grid-column: span 4; }
            .t-login { grid-column: span 4; }
            .t-notice { grid-column: span 4; }
            .t-release, .t-sys, .t-client, .t-help { grid-column: span 2; }
        }
        @media (max-width: 767.98px) {
            .grid { grid-template-columns: 1fr; }
            .t-brand, .t-login, .t-notice, .t-release, .t-sys, .t-client, .t-help { grid-column: span 1; }
            .brand-name { font-size: 1.6rem; }
        }
    </style>
</head>

<body>
    <div class="grid">

        <!-- 系統識別 -->
        <section class="tile t-brand">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                <div>
                    <div class="small opacity-75 mb-1"><i class="bi bi-hospital me-1"></i><span id="org">—</span>　<span id="orgSub">—</span></div>
                    <div class="brand-name" id="sysName">—</div>
                </div>
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <span class="code" id="sysCode">—</span>
                    <span class="env" id="sysEnv">—</span>
                    <span class="small opacity-75" id="clock">—</span>
                </div>
            </div>
        </section>

        <!-- 登入 -->
        <section class="tile t-login">
            <h2 style="color:var(--muted)"><i class="bi bi-box-arrow-in-right"></i>登入</h2>
            <form id="loginForm" novalidate>
                <div class="mb-2">
                    <label class="form-label" for="account">帳號（員工編號）</label>
                    <input type="text" class="form-control" id="account" placeholder="A12345" autocomplete="username" />
                </div>
                <div class="mb-2">
                    <label class="form-label" for="password">密碼</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="請輸入密碼" autocomplete="current-password" />
                        <span class="input-group-text" id="tp" role="button" tabindex="0" aria-label="顯示密碼"><i class="bi bi-eye" id="tpi"></i></span>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rm" />
                        <label class="form-check-label small text-secondary" for="rm">記住此電腦</label>
                    </div>
                    <div class="small"><a href="#">忘記密碼</a><span class="text-secondary mx-1">·</span><a href="#">變更密碼</a></div>
                </div>
                <div id="msg" class="alert py-2 px-3 small d-none" style="border-radius:0"></div>
                <button class="btn btn-go w-100" type="submit">登入 <span id="short"></span></button>
            </form>
            <p class="small text-secondary mt-3 mb-0" id="footer">—</p>
        </section>

        <!-- 公告 -->
        <section class="tile t-notice">
            <h2>
                <i class="bi bi-megaphone"></i>公告
                <span class="ms-auto d-flex gap-1">
                    <button class="btn btn-sm chip chip-solid text-white border-0 active" data-scope="ALL">全部</button>
                    <button class="btn btn-sm chip text-white border-0" data-scope="GLOBAL">全系統</button>
                    <button class="btn btn-sm chip text-white border-0" data-scope="SYSTEM">本系統</button>
                </span>
            </h2>
            <div class="scroll" id="noticeList"></div>
        </section>

        <!-- 更版 -->
        <section class="tile t-release">
            <h2><i class="bi bi-arrow-repeat"></i>更版資訊</h2>
            <div class="scroll" id="releaseList"></div>
        </section>

        <!-- 版本與維護者 -->
        <section class="tile t-sys">
            <h2><i class="bi bi-info-circle"></i>版本與維護者</h2>
            <div class="scroll">
                <div id="sysRows" class="mb-2"></div>
                <div id="maintRows"></div>
            </div>
        </section>

        <!-- 教學 -->
        <section class="tile t-client">
            <h2><i class="bi bi-pc-display"></i>登入端電腦與最後登入</h2>
            <div class="scroll">
                <div id="clientRows" class="mb-2"></div>
                <div id="lastRows"></div>
                <div class="small mt-2 d-none" id="failBox" style="background:rgba(255,255,255,.18);padding:.4rem .6rem"></div>
            </div>
        </section>

        <!-- 教學 -->
        <section class="tile t-help">
            <h2><i class="bi bi-life-preserver"></i>系統功能教學與說明</h2>
            <div class="scroll" id="helpList"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="../assets/libs/jquery/jquery.min.js"><\/script>');</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.bootstrap || document.write('<script src="../assets/libs/bootstrap/bootstrap.bundle.min.js"><\/script>');</script>
    <script src="../assets/js/data.js"></script>
    <script src="shared.js"></script>
    <script>
        jQuery(function ($) {
            var I = LD.identity();
            LD.applyEnv();
            LD.fill({
                '#org': I.org, '#orgSub': I.orgSub, '#sysName': I.name,
                '#sysCode': I.code, '#sysEnv': I.envText,
                '#short': I.short ? '（' + I.short + '）' : '', '#footer': I.footer
            });
            LD.startClock(function (t) { $('#clock').text(t.date + '　' + t.time); });

            $('#sysRows').html(LD.kvHtml(LD.systemRows()));
            $('#maintRows').html(LD.kvHtml(LD.maintainerRows(), 'kv', true));
            $('#clientRows').html(LD.kvHtml(LD.clientItems().map(function (i) { return [i.label, i.value]; })));
            $('#lastRows').html(LD.kvHtml(LD.lastLoginRows()));
            $('#helpList').html(LD.helpHtml(function (h) {
                return '<a class="help-item" href="' + LD.esc(h.href) + '"><i class="bi ' + LD.esc(h.icon) + '"></i>' +
                    '<span>' + LD.esc(h.title) + '　<span style="opacity:.75;font-size:.78rem">' + LD.esc(h.desc) + '</span></span></a>';
            }));
            $('#releaseList').html(LD.releaseHtml());

            var ft = LD.failedLoginText();
            if (ft) { $('#failBox').removeClass('d-none').text(ft); }

            function renderNotices(scope) {
                $('#noticeList').html(LD.noticeHtml(scope, function (n) {
                    return '<div class="n-item">' +
                        '<div class="d-flex flex-wrap gap-1 align-items-center mb-1">' +
                        (n.pinned ? '<i class="bi bi-pin-angle-fill"></i>' : '') +
                        '<span class="chip chip-solid">' + LD.esc(n.levelName) + '</span>' +
                        '<span class="chip">' + LD.esc(n.scopeName) + '</span></div>' +
                        '<div class="t">' + LD.esc(n.title) + '</div>' +
                        '<div class="c">' + LD.esc(n.content) + '</div>' +
                        '<div class="m">' + LD.esc(n.date) + ' · ' + LD.esc(n.publisher) + ' · ' + LD.esc(n.id) + '</div></div>';
                }, '<p class="small mb-0" style="opacity:.85">沒有符合條件的公告。</p>'));
            }
            renderNotices('ALL');
            $('[data-scope]').on('click', function () {
                $('[data-scope]').removeClass('chip-solid active');
                $(this).addClass('chip-solid active');
                renderNotices($(this).data('scope'));
            });

            LD.bindPasswordToggle('#password', '#tp', '#tpi');
            LD.bindDemoLogin('#loginForm', '#account', '#password', function (m, t) {
                $('#msg').removeClass('d-none alert-warning alert-info').addClass('alert-' + t).text(m);
            });
        });
    </script>
</body>

</html>
