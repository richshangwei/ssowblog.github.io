<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>款式 08｜側欄應用</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          onerror="this.onerror=null;this.href='../assets/libs/bootstrap/bootstrap.min.css';" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          onerror="this.onerror=null;this.href='../assets/libs/bootstrap-icons/bootstrap-icons.css';" />
    <style>
        /* ===== 款式 08：側欄應用 App Shell ==================================
           登入頁長得就像登入後的後台：左側導覽、上方系統列、右側內容區。
           好處是使用者在登入前就熟悉版面，且「未登入」狀態被明確標示，
           系統名稱與代碼固定在左上角，跟登入後完全一致。
           ================================================================= */
        :root {
            --ink: #1a2331; --muted: #6a798c; --line: #e4e9f0;
            --side: #16243a; --side-2: #101b2d; --brand: #2f6fed; --ok: #12805c;
        }
        body {
            margin: 0; background: #f5f7fa; color: var(--ink);
            font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        }
        a { text-decoration: none; }

        .shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }

        .side { background: linear-gradient(180deg, var(--side), var(--side-2)); color: #fff; padding: 1rem .85rem; }
        .side .brand { display: flex; gap: .7rem; align-items: center; padding: .3rem .4rem 1rem; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: .8rem; }
        .side .mark { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; border-radius: .5rem; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); font-weight: 800; }
        .side .nm { font-weight: 800; font-size: .95rem; line-height: 1.2; }
        .side .cd { font-family: Consolas, monospace; font-size: .72rem; color: #8fb6ff; letter-spacing: .06em; }

        .nav-item-x {
            display: flex; align-items: center; gap: .65rem; padding: .55rem .7rem; border-radius: .45rem;
            color: rgba(255,255,255,.8); font-size: .92rem; font-weight: 600; cursor: pointer; margin-bottom: .15rem;
        }
        .nav-item-x:hover { background: rgba(255,255,255,.08); color: #fff; }
        .nav-item-x.active { background: var(--brand); color: #fff; }
        .nav-item-x .badge { margin-left: auto; }
        .side .foot { margin-top: 1rem; padding-top: .8rem; border-top: 1px solid rgba(255,255,255,.12); font-size: .76rem; color: rgba(255,255,255,.6); }

        .topbar {
            background: #fff; border-bottom: 1px solid var(--line); padding: .6rem 1.25rem;
            display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; position: sticky; top: 0; z-index: 5;
        }
        .env { font-size: .76rem; font-weight: 800; letter-spacing: .08em; border-radius: 999px; padding: .12rem .6rem; background: #dcf3e8; color: var(--ok); }
        .state-off { font-size: .78rem; font-weight: 700; border-radius: 999px; padding: .12rem .6rem; background: #fdecea; color: #96201a; }

        .content { padding: 1.25rem; }
        .card-x { background: #fff; border: 1px solid var(--line); border-radius: .6rem; padding: 1.1rem 1.25rem; }
        .card-x > h2 { font-size: 1.02rem; font-weight: 800; margin: 0 0 .9rem; display: flex; align-items: center; gap: .5rem; }

        .form-control { padding: .75rem .85rem; border-color: var(--line); }
        .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(47,111,237,.16); }
        .form-label { font-weight: 700; font-size: .85rem; color: var(--muted); }
        .input-group-text { background: #fff; border-color: var(--line); cursor: pointer; color: var(--muted); }
        .btn-go { background: var(--brand); color: #fff; font-weight: 800; padding: .75rem; border: none; }
        .btn-go:hover { background: #1f55c7; color: #fff; }

        .notice { border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: .5rem; padding: .8rem .95rem; margin-bottom: .6rem; }
        .notice.lv-danger { border-left-color: #b42318; } .notice.lv-warning { border-left-color: #9a5b13; }
        .notice.lv-info { border-left-color: #0b6bcb; } .notice.lv-success { border-left-color: #167044; }
        .notice h6 { font-weight: 700; margin: .3rem 0; }
        .meta { font-size: .78rem; color: var(--muted); }
        .pill { font-size: .72rem; border-radius: 999px; padding: .05rem .55rem; border: 1px solid var(--line); }
        .pill-GLOBAL { background: #e8f1fb; color: #0b4f9e; } .pill-SYSTEM { background: #fdf2e3; color: #7a5322; }

        .rel-block { border-bottom: 1px solid var(--line); padding-bottom: .7rem; margin-bottom: .7rem; }
        .rel-block:last-child { border-bottom: none; }
        .rel-head { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
        .rel-ver { font-family: Consolas, monospace; font-weight: 800; color: var(--brand); }
        .rel-now { background: #dcf3e8; color: var(--ok); font-size: .7rem; border-radius: 999px; padding: 0 .5rem; }
        .rel-date, .rel-sum { font-size: .8rem; color: var(--muted); }
        .rel-list { list-style: none; margin: .35rem 0 0; padding: 0; }
        .rel-item { display: flex; gap: .5rem; font-size: .88rem; padding: .15rem 0; }
        .rel-tag { font-size: .7rem; font-weight: 700; border-radius: .25rem; padding: 0 .4rem; white-space: nowrap; height: 1.3rem; }
        .t-feature { background: #e3f0ff; color: #0b4f9e; } .t-fix { background: #fdecea; color: #96201a; }
        .t-security { background: #ede9fe; color: #5b21b6; } .t-change { background: #eef3f7; color: #46545f; }

        table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
        table.t th, table.t td { border: 1px solid var(--line); padding: .45rem .7rem; }
        table.t th { background: #f7f9fc; color: var(--muted); font-weight: 600; width: 38%; text-align: left; white-space: nowrap; }
        table.t td { word-break: break-word; }

        .help-item { display: flex; gap: .7rem; padding: .6rem .8rem; border: 1px solid var(--line); border-radius: .5rem; color: var(--ink); margin-bottom: .5rem; }
        .help-item:hover { border-color: var(--brand); color: var(--ink); }
        .help-item i { color: var(--brand); font-size: 1.2rem; }
        .help-item small { display: block; color: var(--muted); }

        @media (max-width: 991.98px) {
            .shell { grid-template-columns: 1fr; }
            .side { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; }
            .side .brand { width: 100%; margin-bottom: .4rem; padding-bottom: .6rem; }
            .nav-item-x { margin-bottom: 0; }
            .side .foot { width: 100%; }
        }
    </style>
</head>

<body>
    <div class="shell">

        <!-- 左側導覽 -->
        <nav class="side">
            <div class="brand">
                <div class="mark" id="mark">—</div>
                <div>
                    <div class="nm" id="sideName">—</div>
                    <div class="cd" id="sideCode">—</div>
                </div>
            </div>

            <div class="nav-item-x active" data-view="login"><i class="bi bi-box-arrow-in-right"></i>登入</div>
            <div class="nav-item-x" data-view="notice"><i class="bi bi-megaphone"></i>公告<span class="badge text-bg-danger rounded-pill" id="nCount">0</span></div>
            <div class="nav-item-x" data-view="release"><i class="bi bi-arrow-repeat"></i>更版資訊</div>
            <div class="nav-item-x" data-view="system"><i class="bi bi-info-circle"></i>系統與維護者</div>
            <div class="nav-item-x" data-view="help"><i class="bi bi-life-preserver"></i>教學與說明</div>
            <div class="nav-item-x" data-view="client"><i class="bi bi-pc-display"></i>本機與登入紀錄</div>

            <div class="foot">
                <div id="sideOrg">—</div>
                <div id="sideVer">—</div>
                <div id="sideUnit">—</div>
            </div>
        </nav>

        <!-- 主區 -->
        <div>
            <div class="topbar">
                <i class="bi bi-hospital text-primary"></i>
                <strong id="topName">—</strong>
                <span class="text-secondary small" id="topCode">—</span>
                <span class="env" id="topEnv">—</span>
                <span class="state-off"><i class="bi bi-shield-lock me-1"></i>尚未登入</span>
                <span class="ms-auto small text-secondary" id="clock">—</span>
            </div>

            <div class="content">
                <!-- 登入 -->
                <section data-pane="login">
                    <div class="row g-3">
                        <div class="col-12 col-xl-5">
                            <div class="card-x">
                                <h2><i class="bi bi-box-arrow-in-right"></i>員工登入</h2>
                                <p class="small text-secondary mb-3">登入後將進入 <strong id="inlineName">—</strong>（<span id="inlineCode">—</span>）。</p>
                                <form id="loginForm" novalidate>
                                    <div class="mb-3">
                                        <label class="form-label" for="account">帳號（員工編號）</label>
                                        <input type="text" class="form-control" id="account" placeholder="例如：A12345" autocomplete="username" />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" for="password">密碼</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="password" placeholder="請輸入密碼" autocomplete="current-password" />
                                            <span class="input-group-text" id="tp" role="button" tabindex="0" aria-label="顯示密碼"><i class="bi bi-eye" id="tpi"></i></span>
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="rm" />
                                            <label class="form-check-label small text-secondary" for="rm">記住此電腦</label>
                                        </div>
                                        <div class="small"><a href="#">忘記密碼</a><span class="text-secondary mx-1">·</span><a href="#">變更密碼</a></div>
                                    </div>
                                    <div id="msg" class="alert py-2 px-3 small d-none"></div>
                                    <button class="btn btn-go w-100" type="submit">登入 <span id="short"></span></button>
                                </form>
                            </div>
                        </div>
                        <div class="col-12 col-xl-7">
                            <div class="card-x mb-3">
                                <h2><i class="bi bi-megaphone"></i>最新公告</h2>
                                <div id="noticePreview"></div>
                            </div>
                            <div class="card-x">
                                <h2><i class="bi bi-pc-display"></i>本次登入電腦</h2>
                                <table class="t"><tbody id="clientPreview"></tbody></table>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 公告 -->
                <section data-pane="notice" class="d-none">
                    <div class="card-x">
                        <h2>
                            <i class="bi bi-megaphone"></i>公告
                            <span class="ms-auto btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary active" data-scope="ALL">全部</button>
                                <button class="btn btn-outline-secondary" data-scope="GLOBAL">全系統</button>
                                <button class="btn btn-outline-secondary" data-scope="SYSTEM">本系統</button>
                            </span>
                        </h2>
                        <div id="noticeList"></div>
                    </div>
                </section>

                <!-- 更版 -->
                <section data-pane="release" class="d-none">
                    <div class="card-x"><h2><i class="bi bi-arrow-repeat"></i>更版資訊</h2><div id="releaseList"></div></div>
                </section>

                <!-- 系統 -->
                <section data-pane="system" class="d-none">
                    <div class="row g-3">
                        <div class="col-12 col-lg-6"><div class="card-x h-100"><h2><i class="bi bi-hdd-stack"></i>版本資訊</h2><table class="t"><tbody id="sysRows"></tbody></table></div></div>
                        <div class="col-12 col-lg-6"><div class="card-x h-100"><h2><i class="bi bi-person-gear"></i>維護者資訊與聯絡方式</h2><table class="t"><tbody id="maintRows"></tbody></table></div></div>
                    </div>
                </section>

                <!-- 教學 -->
                <section data-pane="help" class="d-none">
                    <div class="card-x"><h2><i class="bi bi-life-preserver"></i>系統功能教學與說明</h2><div id="helpList"></div></div>
                </section>

                <!-- 本機 -->
                <section data-pane="client" class="d-none">
                    <div class="row g-3">
                        <div class="col-12 col-lg-6"><div class="card-x h-100"><h2><i class="bi bi-pc"></i>登入端電腦</h2><table class="t"><tbody id="clientRows"></tbody></table></div></div>
                        <div class="col-12 col-lg-6">
                            <div class="card-x h-100">
                                <h2><i class="bi bi-clock-history"></i>最後一次登入</h2>
                                <table class="t"><tbody id="lastRows"></tbody></table>
                                <div class="alert alert-warning py-2 px-3 small mt-3 mb-0 d-none" id="failBox"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <p class="text-secondary small mt-3 mb-0" id="footer">—</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="../assets/libs/jquery/jquery.min.js"><\/script>');</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.bootstrap || document.write('<script src="../assets/libs/bootstrap/bootstrap.bundle.min.js"><\/script>');</script>
    <script src="../assets/js/data.js"></script>
    <script src="shared.js"></script>
    <script>
        jQuery(function ($) {
            var I = LD.identity();
            LD.applyEnv();
            LD.fill({
                '#mark': I.short, '#sideName': I.name, '#sideCode': I.code,
                '#topName': I.name, '#topCode': I.code, '#topEnv': I.envText,
                '#inlineName': I.name, '#inlineCode': I.code,
                '#sideOrg': I.org, '#sideVer': '版本 ' + I.version, '#sideUnit': (LD.cfg.maintainer || {}).unit || '',
                '#short': I.short ? '（' + I.short + '）' : '', '#footer': I.footer
            });
            LD.startClock(function (t) { $('#clock').text(t.date + '　' + t.time); });

            $('#sysRows').html(LD.tableRows(LD.systemRows()));
            $('#maintRows').html(LD.tableRows(LD.maintainerRows(), true));
            $('#clientRows').html(LD.tableRows(LD.clientItems().map(function (i) { return [i.label, i.value]; })));
            $('#clientPreview').html(LD.tableRows(LD.clientItems().slice(0, 5).map(function (i) { return [i.label, i.value]; })
                .concat([['最後一次登入', LD.lastLoginText()]])));
            $('#lastRows').html(LD.tableRows(LD.lastLoginRows()));
            $('#releaseList').html(LD.releaseHtml());
            $('#helpList').html(LD.helpHtml());
            $('#nCount').text(LD.notices('ALL').length);

            var ft = LD.failedLoginText();
            if (ft) { $('#failBox').removeClass('d-none').text(ft); }

            function card(n) {
                return '<article class="notice lv-' + LD.esc(n.level) + '">' +
                    '<div class="d-flex flex-wrap align-items-center gap-2">' +
                    (n.pinned ? '<i class="bi bi-pin-angle-fill text-danger"></i>' : '') +
                    '<span class="badge text-bg-' + LD.esc(n.level) + '">' + LD.esc(n.levelName) + '</span>' +
                    '<span class="pill pill-' + LD.esc(n.scope) + '">' + LD.esc(n.scopeName) + '</span></div>' +
                    '<h6>' + LD.esc(n.title) + '</h6><p class="small mb-1">' + LD.esc(n.content) + '</p>' +
                    '<div class="meta">' + LD.esc(n.date) + ' · ' + LD.esc(n.publisher) + ' · ' + LD.esc(n.id) + '</div></article>';
            }
            function renderNotices(scope) { $('#noticeList').html(LD.noticeHtml(scope, card)); }
            renderNotices('ALL');
            $('#noticePreview').html(LD.notices('ALL').slice(0, 2).map(card).join('') +
                '<a class="small" href="#" data-view-link="notice">查看全部公告 <i class="bi bi-arrow-right"></i></a>');

            $('[data-scope]').on('click', function () {
                $('[data-scope]').removeClass('active'); $(this).addClass('active');
                renderNotices($(this).data('scope'));
            });

            function show(view) {
                $('[data-pane]').addClass('d-none').filter('[data-pane="' + view + '"]').removeClass('d-none');
                $('.nav-item-x').removeClass('active').filter('[data-view="' + view + '"]').addClass('active');
            }
            $('.nav-item-x').on('click', function () { show($(this).data('view')); });
            $(document).on('click', '[data-view-link]', function (e) { e.preventDefault(); show($(this).data('view-link')); });

            LD.bindPasswordToggle('#password', '#tp', '#tpi');
            LD.bindDemoLogin('#loginForm', '#account', '#password', function (m, t) {
                $('#msg').removeClass('d-none alert-warning alert-info').addClass('alert-' + t).text(m);
            });
        });
    </script>
</body>

</html>
