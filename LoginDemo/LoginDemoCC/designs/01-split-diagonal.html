<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>款式 01｜斜切雙欄</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          onerror="this.onerror=null;this.href='../assets/libs/bootstrap/bootstrap.min.css';" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          onerror="this.onerror=null;this.href='../assets/libs/bootstrap-icons/bootstrap-icons.css';" />
    <style>
        /* ===== 款式 01：斜切雙欄 Split Diagonal ==============================
           左側深色品牌區用 clip-path 斜切進白色表單區，
           資訊全部收進右側 offcanvas 抽屜，主畫面只留登入與系統識別。
           ================================================================= */
        :root {
            --ink: #101b28; --brand: #0d3b66; --brand-2: #145a92;
            --accent: #f4a259; --muted: #6b7b8c; --line: #e3e9f0;
        }
        body {
            margin: 0; min-height: 100vh; color: var(--ink); background: #fff;
            font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        }
        a { text-decoration: none; }

        .stage { min-height: 100vh; display: grid; grid-template-columns: 46% 54%; }

        .brand-side {
            position: relative; color: #fff; padding: 3rem 3.5rem 3rem 3rem;
            background: linear-gradient(150deg, var(--brand-2), var(--brand) 55%, #08263f);
            clip-path: polygon(0 0, 100% 0, calc(100% - 90px) 100%, 0 100%);
            display: flex; flex-direction: column;
        }
        .brand-side::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 26px);
            pointer-events: none;
        }
        .mark {
            width: 60px; height: 60px; display: grid; place-items: center;
            border: 2px solid rgba(255,255,255,.4); border-radius: .8rem;
            font-weight: 800; font-size: 1.2rem; letter-spacing: .06em;
        }
        .sys-name { font-size: 2.6rem; font-weight: 800; line-height: 1.15; margin: 0; }
        .code {
            font-family: Consolas, monospace; letter-spacing: .1em;
            border: 1px solid rgba(255,255,255,.45); border-radius: .35rem; padding: .2rem .6rem;
        }
        .env { background: #127048; border-radius: .35rem; padding: .22rem .7rem; font-weight: 800; letter-spacing: .1em; }
        .mini { font-size: .85rem; color: rgba(255,255,255,.78); }
        .mini strong { color: #fff; }

        .form-side { padding: 3rem 3rem 3rem 1.5rem; display: flex; align-items: center; }
        .form-inner { width: min(420px, 100%); margin: 0 auto; }

        .form-control { padding: .8rem .9rem; border-color: var(--line); }
        .form-control:focus { border-color: var(--brand-2); box-shadow: 0 0 0 .22rem rgba(20,90,146,.18); }
        .form-label { font-weight: 700; font-size: .86rem; color: var(--muted); }
        .input-group-text { background: #fff; border-color: var(--line); cursor: pointer; color: var(--muted); }
        .btn-go { background: var(--brand); color: #fff; font-weight: 800; padding: .8rem; border: none; }
        .btn-go:hover { background: #08263f; color: #fff; }

        .drawer-btn {
            border: 1px solid var(--line); border-radius: .55rem; background: #fff;
            padding: .6rem .5rem; text-align: center; color: var(--ink); font-size: .82rem; font-weight: 600;
            display: block; position: relative;
        }
        .drawer-btn i { display: block; font-size: 1.2rem; color: var(--accent); }
        .drawer-btn:hover { border-color: var(--accent); }
        .drawer-btn .dot {
            position: absolute; top: .3rem; right: .4rem; background: #c0392b; color: #fff;
            border-radius: 999px; font-size: .66rem; padding: 0 .35rem; font-weight: 700;
        }

        .kv { display: flex; justify-content: space-between; gap: .8rem; padding: .35rem 0; border-bottom: 1px dashed var(--line); font-size: .88rem; }
        .kv:last-child { border-bottom: none; }
        .kv .k { color: var(--muted); white-space: nowrap; }
        .kv .v { font-weight: 600; text-align: right; word-break: break-word; }

        .notice { border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: .45rem; padding: .75rem .9rem; margin-bottom: .6rem; }
        .notice.lv-danger { border-left-color: #b42318; }
        .notice.lv-warning { border-left-color: #9a5b13; }
        .notice.lv-info { border-left-color: #0b6bcb; }
        .notice.lv-success { border-left-color: #167044; }
        .notice h6 { font-weight: 700; margin: .3rem 0 .35rem; }
        .meta { font-size: .76rem; color: var(--muted); }
        .pill { font-size: .7rem; border-radius: 999px; padding: .05rem .5rem; border: 1px solid var(--line); }
        .pill-GLOBAL { background: #e8f1fb; color: #0b4f9e; }
        .pill-SYSTEM { background: #fdf2e3; color: #7a5322; }

        .rel-block { margin-bottom: 1rem; }
        .rel-head { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
        .rel-ver { font-family: Consolas, monospace; font-weight: 800; color: var(--brand); }
        .rel-now { background: #167044; color: #fff; font-size: .7rem; border-radius: .25rem; padding: 0 .4rem; }
        .rel-date, .rel-sum { font-size: .8rem; color: var(--muted); }
        .rel-list { list-style: none; padding: 0; margin: .4rem 0 0; }
        .rel-item { display: flex; gap: .5rem; padding: .25rem 0; font-size: .87rem; }
        .rel-tag { font-size: .7rem; font-weight: 700; border-radius: .25rem; padding: 0 .35rem; white-space: nowrap; height: 1.3rem; }
        .t-feature { background: #e3f0ff; color: #0b4f9e; }
        .t-fix { background: #fdecea; color: #96201a; }
        .t-security { background: #ede9fe; color: #5b21b6; }
        .t-change { background: #eef3f7; color: #46545f; }

        .help-item { display: flex; gap: .6rem; padding: .6rem 0; border-top: 1px solid var(--line); color: var(--ink); }
        .help-item:first-child { border-top: none; }
        .help-item i { color: var(--accent); font-size: 1.1rem; }
        .help-item small { display: block; color: var(--muted); }

        @media (max-width: 991.98px) {
            .stage { grid-template-columns: 1fr; }
            .brand-side { clip-path: none; padding: 2rem 1.25rem; }
            .form-side { padding: 2rem 1.25rem; }
            .sys-name { font-size: 1.9rem; }
        }
    </style>
</head>

<body>
    <div class="stage">
        <!-- 左：系統識別 -->
        <section class="brand-side">
            <div class="d-flex align-items-center gap-3 mb-5 position-relative">
                <div class="mark" id="mark">—</div>
                <div class="lh-sm">
                    <div class="fw-bold" id="org">—</div>
                    <div class="mini" id="orgSub">—</div>
                </div>
            </div>

            <div class="position-relative">
                <p class="mini mb-2">您正在登入</p>
                <h1 class="sys-name mb-3" id="sysName">—</h1>
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <span class="code" id="sysCode">—</span>
                    <span class="env" id="sysEnv">—</span>
                </div>
                <p class="mini mb-0" id="tagline"></p>
            </div>

            <div class="mt-auto pt-4 position-relative">
                <div class="row g-3 mini">
                    <div class="col-6"><span class="d-block opacity-75">版本</span><strong id="mVersion">—</strong></div>
                    <div class="col-6"><span class="d-block opacity-75">維護單位</span><strong id="mUnit">—</strong></div>
                    <div class="col-6"><span class="d-block opacity-75">本機電腦</span><strong id="mPc">—</strong></div>
                    <div class="col-6"><span class="d-block opacity-75">作業系統</span><strong id="mOs">—</strong></div>
                    <div class="col-12"><span class="d-block opacity-75">最後一次登入</span><strong id="mLast">—</strong></div>
                </div>
                <div class="mini mt-3" id="clock">—</div>
            </div>
        </section>

        <!-- 右：登入 -->
        <section class="form-side">
            <div class="form-inner">
                <h2 class="h4 fw-bold mb-1">員工登入</h2>
                <p class="text-secondary small mb-4">登入後將進入 <strong id="sysNameInline">—</strong>。</p>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="account">帳號（員工編號）</label>
                        <input type="text" class="form-control" id="account" placeholder="例如：A12345" autocomplete="username" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">密碼</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" placeholder="請輸入密碼" autocomplete="current-password" />
                            <span class="input-group-text" id="tp" role="button" tabindex="0" aria-label="顯示密碼"><i class="bi bi-eye" id="tpi"></i></span>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rm" />
                            <label class="form-check-label small text-secondary" for="rm">記住此電腦</label>
                        </div>
                        <div class="small"><a href="#">忘記密碼</a><span class="text-secondary mx-1">·</span><a href="#">變更密碼</a></div>
                    </div>
                    <div id="msg" class="alert py-2 px-3 small d-none"></div>
                    <button class="btn btn-go w-100 mb-4" type="submit">登入 <span id="short"></span></button>
                </form>

                <p class="text-secondary small mb-2">登入前資訊</p>
                <div class="row g-2">
                    <div class="col-3"><a class="drawer-btn" data-bs-toggle="offcanvas" href="#dNotice"><i class="bi bi-megaphone"></i>公告<span class="dot" id="nCount">0</span></a></div>
                    <div class="col-3"><a class="drawer-btn" data-bs-toggle="offcanvas" href="#dRelease"><i class="bi bi-arrow-repeat"></i>更版</a></div>
                    <div class="col-3"><a class="drawer-btn" data-bs-toggle="offcanvas" href="#dSystem"><i class="bi bi-info-circle"></i>系統</a></div>
                    <div class="col-3"><a class="drawer-btn" data-bs-toggle="offcanvas" href="#dHelp"><i class="bi bi-life-preserver"></i>教學</a></div>
                </div>
                <p class="text-secondary small mt-4 mb-0" id="footer">—</p>
            </div>
        </section>
    </div>

    <!-- 抽屜 -->
    <div class="offcanvas offcanvas-end" id="dNotice" tabindex="-1" style="width:min(520px,100%)">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title"><i class="bi bi-megaphone me-2"></i>公告</h5>
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div class="btn-group btn-group-sm mb-3 w-100">
                <input type="radio" class="btn-check" name="sc" id="sc1" value="ALL" checked /><label class="btn btn-outline-secondary" for="sc1">全部</label>
                <input type="radio" class="btn-check" name="sc" id="sc2" value="GLOBAL" /><label class="btn btn-outline-secondary" for="sc2">全系統</label>
                <input type="radio" class="btn-check" name="sc" id="sc3" value="SYSTEM" /><label class="btn btn-outline-secondary" for="sc3">本系統</label>
            </div>
            <div id="noticeList"></div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" id="dRelease" tabindex="-1" style="width:min(520px,100%)">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title"><i class="bi bi-arrow-repeat me-2"></i>更版資訊</h5>
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="releaseList"></div>
    </div>

    <div class="offcanvas offcanvas-end" id="dSystem" tabindex="-1" style="width:min(520px,100%)">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title"><i class="bi bi-info-circle me-2"></i>系統、維護者與本機</h5>
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <p class="fw-bold small text-secondary mb-1">版本資訊</p>
            <div id="sysRows" class="mb-4"></div>
            <p class="fw-bold small text-secondary mb-1">維護者資訊與聯絡方式</p>
            <div id="maintRows" class="mb-4"></div>
            <p class="fw-bold small text-secondary mb-1">登入端電腦</p>
            <div id="clientRows" class="mb-4"></div>
            <p class="fw-bold small text-secondary mb-1">最後一次登入</p>
            <div id="lastRows"></div>
            <div class="alert alert-warning py-2 px-3 small mt-3 mb-0 d-none" id="failBox"></div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" id="dHelp" tabindex="-1" style="width:min(520px,100%)">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title"><i class="bi bi-life-preserver me-2"></i>教學與說明</h5>
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="helpList"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="../assets/libs/jquery/jquery.min.js"><\/script>');</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.bootstrap || document.write('<script src="../assets/libs/bootstrap/bootstrap.bundle.min.js"><\/script>');</script>
    <script src="../assets/js/data.js"></script>
    <script src="shared.js"></script>
    <script>
        jQuery(function ($) {
            var I = LD.identity(), c = LD.cfg.client || {};
            LD.applyEnv();
            LD.fill({
                '#mark': I.short, '#org': I.org, '#orgSub': I.orgSub,
                '#sysName': I.name, '#sysNameInline': I.name, '#sysCode': I.code, '#sysEnv': I.envText,
                '#tagline': I.tagline, '#short': I.short ? '（' + I.short + '）' : '',
                '#mVersion': I.version, '#mUnit': (LD.cfg.maintainer || {}).unit || '-',
                '#mPc': c.computerName || '-', '#mOs': c.os || LD.detectOs(),
                '#mLast': LD.lastLoginText(), '#footer': I.footer
            });
            LD.startClock(function (t) { $('#clock').text(t.date + '　' + t.time); });

            $('#sysRows').html(LD.kvHtml(LD.systemRows()));
            $('#maintRows').html(LD.kvHtml(LD.maintainerRows(), 'kv', true));
            $('#clientRows').html(LD.kvHtml(LD.clientItems().map(function (i) { return [i.label, i.value]; })));
            $('#lastRows').html(LD.kvHtml(LD.lastLoginRows()));
            $('#helpList').html(LD.helpHtml());
            $('#releaseList').html(LD.releaseHtml());

            var ft = LD.failedLoginText();
            if (ft) { $('#failBox').removeClass('d-none').text(ft); }

            function renderNotices(scope) {
                $('#nCount').text(LD.notices(scope).length);
                $('#noticeList').html(LD.noticeHtml(scope, function (n) {
                    return '<article class="notice lv-' + LD.esc(n.level) + '">' +
                        '<div class="d-flex flex-wrap align-items-center gap-2">' +
                        (n.pinned ? '<i class="bi bi-pin-angle-fill text-danger"></i>' : '') +
                        '<span class="badge text-bg-' + LD.esc(n.level) + '">' + LD.esc(n.levelName) + '</span>' +
                        '<span class="pill pill-' + LD.esc(n.scope) + '">' + LD.esc(n.scopeName) + '</span></div>' +
                        '<h6>' + LD.esc(n.title) + '</h6>' +
                        '<p class="small mb-1">' + LD.esc(n.content) + '</p>' +
                        '<div class="meta">' + LD.esc(n.date) + ' · ' + LD.esc(n.publisher) + ' · ' + LD.esc(n.id) + '</div></article>';
                }));
            }
            renderNotices('ALL');
            LD.bindScope('input[name="sc"]', renderNotices);

            LD.bindPasswordToggle('#password', '#tp', '#tpi');
            LD.bindDemoLogin('#loginForm', '#account', '#password', function (m, t) {
                $('#msg').removeClass('d-none alert-warning alert-info').addClass('alert-' + t).text(m);
            });
        });
    </script>
</body>

</html>
